<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Requests - BUYZA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#222;font-family:Arial,Helvetica,sans-serif}
header{background:#111;color:white;padding:15px 20px}
.nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{color:#ff6b00;font-size:25px;font-weight:900;text-decoration:none}
.nav a:last-child{color:white;text-decoration:none;font-weight:700}
main{max-width:900px;margin:28px auto;padding:0 16px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:27px}
.filter{padding:10px;border:1px solid #ccc;border-radius:9px;font:inherit;background:white}
.hint,.status{line-height:1.5;color:#666}
.status{margin:14px 0}
.request{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.request-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.request h2{font-size:19px;margin:0 0 8px}
.badge{border-radius:999px;padding:6px 10px;background:#fff0df;color:#8a4200;font-size:12px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.badge.accepted{background:#e3f4ff;color:#075985}.badge.completed{background:#e5f6e8;color:#176b2c}.badge.cancelled{background:#eee;color:#555}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:14px 0;line-height:1.5}
.details p{margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.actions button,.actions a{border:0;border-radius:8px;padding:10px 13px;background:#087f5b;color:white;text-decoration:none;font-weight:700;font-size:14px;cursor:pointer}
.actions .secondary{background:#555}.actions .contact{background:#075985}
.empty{background:white;border-radius:14px;padding:22px;text-align:center;color:#666}
button:disabled{opacity:.6;cursor:wait}
@media(max-width:600px){.page-head{align-items:flex-start;flex-direction:column}h1{font-size:23px}.details{grid-template-columns:1fr}.request-top{align-items:flex-start}}
</style>
</head>
<body>
<header><div class="nav"><a class="logo" href="index.html">BUYZA</a><a href="account.html">My Account</a></div></header>
<main>
<div class="page-head">
  <h1>Ride Requests</h1>
  <select id="statusFilter" class="filter" aria-label="Filter ride requests">
    <option value="all">All requests</option>
    <option value="pending">Pending</option>
    <option value="accepted">Accepted</option>
    <option value="completed">Completed</option>
    <option value="cancelled">Cancelled</option>
  </select>
</div>
<p class="hint">Ride requests for your BUYZA Boda Boda listings appear here. You can accept, complete, or cancel each request.</p>
<div id="pageStatus" class="status" role="status">Checking your login…</div>
<section id="requestList" aria-live="polite"></section>
</main>
<script src="auth.js"></script>
<script>
(function(){
  let driverAccountId="";
  let accessToken="";
  let requests=[];
  const statusBox=document.getElementById("pageStatus");
  const requestList=document.getElementById("requestList");

  function escapeHtml(value){
    return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
  }
  function headers(extra){
    return Object.assign({"apikey":SUPABASE_KEY,"Authorization":"Bearer "+accessToken},extra||{});
  }
  function formatDate(value){
    const date=new Date(value);
    return Number.isNaN(date.getTime())?"Time not provided":date.toLocaleString();
  }
  function whatsappUrl(phone){
    let digits=String(phone||"").replace(/\D/g,"");
    if(digits.startsWith("0"))digits="256"+digits.slice(1);
    else if(!digits.startsWith("256"))digits="256"+digits;
    return digits.length>=10?"https://wa.me/"+digits:"";
  }
  function render(){
    const filter=document.getElementById("statusFilter").value;
    const visible=filter==="all"?requests:requests.filter(item=>item.status===filter);
    if(!visible.length){
      requestList.innerHTML='<div class="empty">No ride requests '+(filter==="all"?"yet":"match this filter")+'.</div>';
      return;
    }
    requestList.innerHTML=visible.map(item=>{
      const status=String(item.status||"pending");
      let actions="";
      if(status==="pending"){
        actions='<button type="button" data-id="'+escapeHtml(item.id)+'" data-next="accepted">Accept ride</button><button class="secondary" type="button" data-id="'+escapeHtml(item.id)+'" data-next="cancelled">Cancel</button>';
      }else if(status==="accepted"){
        actions='<button type="button" data-id="'+escapeHtml(item.id)+'" data-next="completed">Mark completed</button><button class="secondary" type="button" data-id="'+escapeHtml(item.id)+'" data-next="cancelled">Cancel</button>';
      }
      const contact=whatsappUrl(item.rider_phone);
      if(contact)actions+='<a class="contact" target="_blank" rel="noopener" href="'+contact+'">WhatsApp rider</a>';
      return '<article class="request"><div class="request-top"><div><h2>'+escapeHtml(item.service_name||"Boda Boda Ride")+'</h2><div>Requested '+escapeHtml(formatDate(item.created_at))+'</div></div><span class="badge '+escapeHtml(status)+'">'+escapeHtml(status)+'</span></div><div class="details"><p><strong>Rider:</strong> '+escapeHtml(item.rider_name)+'</p><p><strong>Phone:</strong> '+escapeHtml(item.rider_phone)+'</p><p><strong>Pickup:</strong> '+escapeHtml(item.pickup_location)+'</p><p><strong>Destination:</strong> '+escapeHtml(item.destination)+'</p><p><strong>Ride time:</strong> '+escapeHtml(formatDate(item.ride_time))+'</p><p><strong>Extra details:</strong> '+escapeHtml(item.rider_note||"None")+'</p></div><div class="actions">'+actions+'</div></article>';
    }).join("");
  }
  async function loadRequests(){
    statusBox.textContent="Loading ride requests…";
    try{
      const query=new URLSearchParams({
        select:"id,listing_id,service_name,rider_name,rider_phone,pickup_location,destination,ride_time,rider_note,status,created_at",
        driver_id:"eq."+driverAccountId,
        order:"created_at.desc"
      });
      const response=await fetch(SUPABASE_URL+"/rest/v1/ride_requests?"+query.toString(),{headers:headers()});
      if(!response.ok)throw new Error(await response.text());
      requests=await response.json();
      statusBox.textContent="";
      render();
    }catch(error){
      console.error("Could not load ride requests:",error);
      statusBox.textContent="Could not load ride requests. Please check that the ride request SQL setup has been run.";
    }
  }
  async function updateStatus(id,nextStatus,button){
    button.disabled=true;
    button.textContent="Saving…";
    try{
      const query=new URLSearchParams({id:"eq."+id,driver_id:"eq."+driverAccountId});
      const response=await fetch(SUPABASE_URL+"/rest/v1/ride_requests?"+query.toString(),{
        method:"PATCH",
        headers:headers({"Content-Type":"application/json","Prefer":"return=minimal"}),
        body:JSON.stringify({status:nextStatus})
      });
      if(!response.ok)throw new Error(await response.text());
      const item=requests.find(row=>String(row.id)===String(id));
      if(item)item.status=nextStatus;
      statusBox.textContent="Ride request marked "+nextStatus+".";
      render();
    }catch(error){
      console.error("Could not update ride request:",error);
      statusBox.textContent="Could not update this request. Please try again.";
      button.disabled=false;
      button.textContent=nextStatus==="accepted"?"Accept ride":nextStatus==="completed"?"Mark completed":"Cancel";
    }
  }
  requestList.addEventListener("click",function(event){
    const button=event.target.closest("button[data-id][data-next]");
    if(button)updateStatus(button.dataset.id,button.dataset.next,button);
  });
  document.getElementById("statusFilter").addEventListener("change",render);
  async function start(){
    try{
      const sessionOK=await checkBuyzaSession();
      const user=JSON.parse(localStorage.getItem("buyza_user")||"null");
      accessToken=localStorage.getItem("buyza_access_token")||"";
      if(!sessionOK||!user||!user.id||!accessToken){
        window.location.href="login.html";
        return;
      }
      driverAccountId=String(user.id);
      await loadRequests();
    }catch(error){
      console.error("Could not verify driver login:",error);
      statusBox.textContent="Please log in to your BUYZA account to view ride requests.";
    }
  }
  start();
})();
</script>
</body>
</html>
