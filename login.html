<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BUYZA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #ff6b00;
        }

        header a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e85f00;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
        }

        .signup a {
            color: #ff6b00;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            margin-top: auto;
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        BUYZA
    </div>

    <a href="index.html">
        Home
    </a>

</header>


<div class="container">

    <div class="box">

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to your BUYZA account
        </p>


        <form id="loginForm">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div
            id="message"
            class="message">
        </div>


        <div class="signup">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>

    </div>

</div>


<footer>

    <h3>
        BUYZA
    </h3>

    <p>
        Buy. Sell. Connect.
    </p>

</footer>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document
                    .getElementById("message");


            message.style.display = "block";

            message.style.background = "#fff0e6";

            message.style.color = "#ff6b00";

            message.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        SUPABASE_URL +
                        "/auth/v1/token?grant_type=password",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY

                            },

                            body: JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error_description ||
                        data.msg ||
                        "Login failed."
                    );

                }


                localStorage.setItem(
                    "buyza_access_token",
                    data.access_token
                );


                localStorage.setItem(
                    "buyza_user",
                    JSON.stringify(data.user)
                );


                message.style.background =
                    "#e7f8ed";

                message.style.color =
                    "#167a3e";

                message.textContent =
                    "Login successful!";


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(error);


                message.style.background =
                    "#ffe8e8";

                message.style.color =
                    "#b00000";

                message.textContent =
                    error.message;

            }

        }
    );

</script>


</body>

</html>
