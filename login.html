<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 25px;
        }

        .logo {
            max-width: 500px;
            margin: auto;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
        }

        .signup a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        BUYZA
    </div>
</header>


<div class="container">

    <div class="login-box">

        <h2>Welcome Back</h2>

        <div class="subtitle">
            Login to your BUYZA account
        </div>


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
                autocomplete="email"
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >


            <button
                type="submit"
                id="loginButton"
            >
                🔐 Login
            </button>

        </form>


        <div id="message"></div>


        <div class="signup">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>


        <a href="index.html" class="home">
            ← Back to BUYZA
        </a>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    message.textContent =
        "Logging in...";

    message.style.color =
        "#555";

    loginButton.disabled = true;


    try {

        /*
         * LOGIN TO SUPABASE
         */

        const response = await fetch(

            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,

            {
                method: "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    email: email,

                    password: password

                })

            }

        );


        const data =
            await response.json();


        console.log(
            "Supabase login response:",
            data
        );


        /*
         * LOGIN FAILED
         */

        if (!response.ok) {

            let errorMessage =
                "Login failed.";

            if (data.error_description) {

                errorMessage =
                    data.error_description;

            } else if (data.msg) {

                errorMessage =
                    data.msg;

            } else if (data.message) {

                errorMessage =
                    data.message;

            }


            message.textContent =
                "❌ " + errorMessage;

            message.style.color =
                "#d32f2f";

            loginButton.disabled = false;

            return;

        }


        /*
         * MAKE SURE WE GOT A TOKEN
         */

        if (!data.access_token || !data.user) {

            message.textContent =
                "❌ Login succeeded but no access token was returned.";

            message.style.color =
                "#d32f2f";

            loginButton.disabled = false;

            return;

        }


        /*
         * REMOVE OLD TOKEN FIRST
         */

        localStorage.removeItem(
            "buyza_access_token"
        );

        localStorage.removeItem(
            "buyza_user"
        );


        /*
         * SAVE NEW TOKEN
         */

        localStorage.setItem(
            "buyza_access_token",
            data.access_token
        );

        localStorage.setItem(
            "buyza_user",
            JSON.stringify(data.user)
        );


        /*
         * SUCCESS
         */

        message.textContent =
            "✅ Login successful!";

        message.style.color =
            "green";


        /*
         * GO TO HOME
         */

        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 800);


    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ Connection error. Please try again.";

        message.style.color =
            "#d32f2f";

        loginButton.disabled = false;

    }

});

</script>

</body>
</html>
