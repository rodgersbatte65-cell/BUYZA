<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 25px;
        }

        .logo {
            max-width: 1100px;
            margin: auto;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 430px;
            margin: 60px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #777;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .success {
            display: block !important;
            background: #e8f5e9;
            color: #176b2c;
        }

        .error {
            display: block !important;
            background: #ffebee;
            color: #c62828;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">BUYZA</div>
</header>

<div class="container">

    <div class="box">

        <h2>Welcome Back</h2>

        <div class="subtitle">
            Login to your BUYZA account
        </div>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                🔐 Login
            </button>

        </form>

        <div id="message"></div>

        <div class="links">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>

        <div class="links">
            <a href="index.html">← Back to BUYZA</a>
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    button.disabled = true;

    button.textContent = "Logging in...";

    message.className = "";

    message.style.display = "none";


    try {

        const response = await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=password",
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            showMessage(
                "❌ " +
                (
                    data.error_description ||
                    data.message ||
                    data.msg ||
                    "Login failed."
                ),
                "error"
            );

            button.disabled = false;
            button.textContent = "🔐 Login";

            return;
        }


        if (!data.access_token || !data.user) {

            showMessage(
                "❌ Login response is missing account information.",
                "error"
            );

            button.disabled = false;
            button.textContent = "🔐 Login";

            return;
        }


        /*
        REMOVE OLD LOGIN
        */

        localStorage.removeItem("buyza_access_token");
        localStorage.removeItem("buyza_user");


        /*
        SAVE FRESH LOGIN
        */

        localStorage.setItem(
            "buyza_access_token",
            data.access_token
        );

        localStorage.setItem(
            "buyza_user",
            JSON.stringify(data.user)
        );


        showMessage(
            "✅ Login successful! Opening BUYZA...",
            "success"
        );


        /*
        GO TO THE HOMEPAGE
        */

        setTimeout(function() {

            window.location.replace("index.html");

        }, 1000);

    }

    catch (error) {

        console.error(error);

        showMessage(
            "❌ Connection error. Please try again.",
            "error"
        );

        button.disabled = false;

        button.textContent =
            "🔐 Login";

    }

});

</script>

</body>
</html>
