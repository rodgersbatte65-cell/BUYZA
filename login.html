<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #d32f2f;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
        }

        .signup a {
            color: #111;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>BUYZA</h1>
</header>

<div class="container">

    <div class="box">

        <h2>👤 Login to BUYZA</h2>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        message.style.color = "#333";
        message.textContent = "Logging in...";


        try {

            const response = await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.msg ||
                    data.message ||
                    data.error_description ||
                    "Login failed"
                );
            }


            /*
             * Save the access token
             */
            localStorage.setItem(
                "buyza_access_token",
                data.access_token
            );


            /*
             * Save the refresh token
             */
            if (data.refresh_token) {

                localStorage.setItem(
                    "buyza_refresh_token",
                    data.refresh_token
                );
            }


            /*
             * Save the user
             */
            if (data.user) {

                localStorage.setItem(
                    "buyza_user",
                    JSON.stringify(data.user)
                );
            }


            message.style.color = "green";

            message.textContent =
                "✅ Login successful!";


            setTimeout(function() {

                window.location.replace("index.html");

            }, 500);


        } catch (error) {

            console.error(error);

            message.style.color = "#d32f2f";

            message.textContent =
                "❌ " + error.message;
        }

    }
);

</script>

</body>
</html>
