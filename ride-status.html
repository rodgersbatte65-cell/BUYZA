<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Ride Request - BUYZA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#222;font-family:Arial,Helvetica,sans-serif}
header{background:#111;color:white;padding:15px 20px}
.nav{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{color:#ff6b00;font-size:25px;font-weight:900;text-decoration:none}
.nav a:last-child{color:white;text-decoration:none;font-weight:700}
main{max-width:700px;margin:28px auto;padding:0 16px}
.card{background:white;padding:24px;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.06)}
h1{font-size:26px;margin:0 0 10px}
.intro{color:#666;line-height:1.5;margin:0 0 18px}
.privacy{background:#fff7e8;color:#76510d;padding:12px 14px;border-radius:9px;font-size:14px;line-height:1.5;margin:18px 0}
.state{border-radius:12px;padding:16px;background:#fff0df;color:#8a4200;font-size:20px;font-weight:900}
.state.accepted{background:#e3f4ff;color:#075985}
.state.completed{background:#e5f6e8;color:#176b2c}
.state.cancelled{background:#eee;color:#555}
.details{line-height:1.7;margin-top:18px}
.details p{margin:5px 0;overflow-wrap:anywhere}
.refresh{margin-top:20px;padding:12px 16px;border:0;border-radius:9px;background:#111;color:white;font-size:15px;font-weight:800;cursor:pointer}
.status{margin-top:14px;color:#666;line-height:1.5}
.status.error{color:#a11}
[hidden]{display:none!important}
@media(max-width:520px){.card{padding:18px}h1{font-size:23px}}
</style>
</head>
<body>
<header><div class="nav"><a class="logo" href="index.html">BUYZA</a><a href="index.html">Home</a></div></header>
<main>
<section class="card">
<h1>Ride Request Status</h1>
<p class="intro">Check the latest status from your driver. This page refreshes automatically every 30 seconds.</p>
<div id="requestState" class="state" hidden></div>
<div id="requestDetails" class="details" hidden></div>
<p class="privacy">This private link can show the trip summary and status for this request. Keep it to yourself.</p>
<button id="refreshButton" class="refresh" type="button">Refresh status</button>
<div id="statusMessage" class="status" role="status">Loading your ride request…</div>
</section>
</main>
<script>
(function(){
  const SUPABASE_URL="https://xbjmdsdgisusnxdmlrxh.supabase.co";
  const SUPABASE_KEY="sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";
  const token=new URLSearchParams(location.search).get("token")||"";
  const stateBox=document.getElementById("requestState");
  const detailsBox=document.getElementById("requestDetails");
  const statusMessage=document.getElementById("statusMessage");
  const refreshButton=document.getElementById("refreshButton");
  let isLoading=false;
  function escapeHtml(value){
    return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
  }
  function formatDate(value){
    const date=new Date(value);
    return Number.isNaN(date.getTime())?"Not available":date.toLocaleString();
  }
  async function loadStatus(){
    if(isLoading)return;
    if(token.length<36){
      statusMessage.className="status error";
      statusMessage.textContent="This tracking link is missing or invalid.";
      refreshButton.disabled=true;
      return;
    }
    isLoading=true;
    refreshButton.disabled=true;
    refreshButton.textContent="Refreshing…";
    try{
      const response=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_ride_request_status",{
        method:"POST",
        headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
        body:JSON.stringify({p_tracking_token:token})
      });
      if(!response.ok)throw new Error(await response.text());
      const rows=await response.json();
      const request=Array.isArray(rows)?rows[0]:rows;
      if(!request){
        stateBox.hidden=true;
        detailsBox.hidden=true;
        statusMessage.className="status error";
        statusMessage.textContent="We couldn’t find this request. Check that you opened the full tracking link.";
        return;
      }
      const label={pending:"Pending — waiting for driver",accepted:"Accepted by driver",completed:"Ride completed",cancelled:"Request cancelled"}[request.status]||request.status;
      stateBox.className="state "+String(request.status||"");
      stateBox.textContent=label;
      stateBox.hidden=false;
      detailsBox.innerHTML="<p><strong>Service:</strong> "+escapeHtml(request.service_name)+"</p><p><strong>Pickup:</strong> "+escapeHtml(request.pickup_location)+"</p><p><strong>Destination:</strong> "+escapeHtml(request.destination)+"</p><p><strong>Requested ride time:</strong> "+escapeHtml(formatDate(request.ride_time))+"</p><p><strong>Updated:</strong> "+escapeHtml(formatDate(request.updated_at))+"</p>";
      detailsBox.hidden=false;
      statusMessage.className="status";
      statusMessage.textContent="Status checked just now.";
    }catch(error){
      console.error("Could not load ride status:",error);
      statusMessage.className="status error";
      statusMessage.textContent="Could not load this request status. Please try Refresh status again.";
    }finally{
      isLoading=false;
      refreshButton.disabled=false;
      refreshButton.textContent="Refresh status";
    }
  }
  refreshButton.addEventListener("click",loadStatus);
  loadStatus();
  window.setInterval(loadStatus,30000);
})();
</script>
</body>
</html>
