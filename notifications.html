<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | BUYZA</title>
<script src="auth.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202329;font-family:Arial,Helvetica,sans-serif}header{background:#171717;color:#fff;padding:14px 20px}.nav{max-width:920px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{font-size:25px;font-weight:900;color:#ff6b00;text-decoration:none}.nav a:last-child{color:#fff;text-decoration:none;font-weight:700}main{max-width:920px;margin:30px auto;padding:0 16px 50px}h1{margin:0 0 8px;font-size:30px}.intro{color:#6d737c;margin:0 0 22px;line-height:1.5}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.toolbar p{margin:0;color:#68717b}.refresh{border:0;border-radius:9px;background:#202329;color:white;padding:10px 14px;font-weight:700}.group{margin:20px 0}.group h2{font-size:18px;margin:0 0 10px}.items{display:grid;gap:10px}.notice{background:#fff;border:1px solid #e9ebef;border-left:4px solid #ff6b00;border-radius:12px;padding:16px;box-shadow:0 3px 12px #00000008}.notice h3{margin:0 0 7px;font-size:16px}.notice p{margin:5px 0;color:#59616a;line-height:1.5;overflow-wrap:anywhere}.notice time{display:block;font-size:12px;color:#858b93;margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a{display:inline-block;background:#202329;color:#fff;text-decoration:none;border-radius:8px;padding:10px 13px;font-size:14px;font-weight:700}.state{background:#fff;border:1px solid #e9ebef;border-radius:12px;padding:24px;text-align:center;color:#69717a;line-height:1.5}.state.error{color:#a12622}.loading{padding:30px;text-align:center;color:#737b85}.badge{display:inline-block;margin-left:6px;background:#fff0e5;color:#ba4a00;border-radius:30px;padding:3px 9px;font-size:12px;font-weight:800}@media(max-width:600px){main{margin:22px auto}.toolbar{align-items:flex-start}.nav{padding:0 2px}h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="nav"><a class="logo" href="index.html">BUYZA</a><a href="account.html">My Account</a></div></header>
<main>
  <h1>🔔 Notifications</h1>
  <p class="intro">New messages and ride requests that may need your attention.</p>
  <div class="toolbar"><p id="updatedAt" role="status">Loading notifications…</p><button class="refresh" id="refreshButton" type="button">Refresh</button></div>
  <section class="group"><h2>✉️ Unread messages <span class="badge" id="messageCount">0</span></h2><div class="items" id="messageItems"></div></section>
  <section class="group"><h2>🏍️ Pending ride requests <span class="badge" id="rideCount">0</span></h2><div class="items" id="rideItems"></div></section>
</main>
<script>
(function(){
  const messagesEl=document.getElementById("messageItems"),ridesEl=document.getElementById("rideItems"),updatedEl=document.getElementById("updatedAt");
  let user=null,token="",timer=null,loading=false;
  function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  function headers(extra){return Object.assign({apikey:SUPABASE_KEY,Authorization:"Bearer "+token},extra||{})}
  async function request(path){const response=await fetch(SUPABASE_URL+path,{headers:headers()});if(!response.ok)throw Error(await response.text());return response.json()}
  function date(value){const parsed=new Date(value);return Number.isNaN(parsed.getTime())?"":parsed.toLocaleString()}
  function empty(title){return '<div class="state">'+esc(title)+'</div>'}
  async function load(){
    if(loading)return;loading=true;document.getElementById("refreshButton").disabled=true;
    try{
      token=await getBuyzaAccessToken();user=JSON.parse(localStorage.getItem("buyza_user")||"null");
      if(!token||!user?.id){location.href="login.html";return}
      const userId=encodeURIComponent(user.id);
      const messageQuery=new URLSearchParams({select:"id,product_id,sender_id,message,created_at",recipient_id:"eq."+userId,read_at:"is.null",order:"created_at.desc",limit:"100"});
      const rideQuery=new URLSearchParams({select:"id,listing_id,service_name,rider_name,rider_phone,pickup_location,destination,ride_time,created_at",driver_id:"eq."+userId,status:"eq.pending",order:"created_at.desc",limit:"100"});
      const [messages,rides]=await Promise.all([request("/rest/v1/buyer_messages?"+messageQuery),request("/rest/v1/ride_requests?"+rideQuery)]);
      const productIds=[...new Set((messages||[]).map(row=>row.product_id).filter(Boolean))];let titles={};
      if(productIds.length){
        const productQuery=new URLSearchParams({select:"id,name",id:"in.("+productIds.join(",")+")"});
        try{const products=await request("/rest/v1/products?"+productQuery);titles=Object.fromEntries(products.map(product=>[String(product.id),product.name||"BUYZA listing"]));}catch(e){console.warn("Listing titles could not be loaded",e)}
      }
      document.getElementById("messageCount").textContent=String(messages.length);
      document.getElementById("rideCount").textContent=String(rides.length);
      messagesEl.innerHTML=messages.length?messages.map(row=>{
        const title=titles[String(row.product_id)]||("Listing #"+row.product_id);
        const href="messages.html?product_id="+encodeURIComponent(row.product_id)+"&seller_id="+encodeURIComponent(row.sender_id);
        return '<article class="notice"><h3>New message about '+esc(title)+'</h3><p>'+esc(row.message||"You received a new message.")+'</p><time>'+esc(date(row.created_at))+'</time><div class="actions"><a href="'+esc(href)+'">Open message</a></div></article>';
      }).join(""):empty("You have no unread messages.");
      ridesEl.innerHTML=rides.length?rides.map(row=>{
        const title=row.service_name||"Boda Boda ride";
        return '<article class="notice"><h3>New ride request · '+esc(title)+'</h3><p><strong>Passenger:</strong> '+esc(row.rider_name||"Not provided")+' · '+esc(row.rider_phone||"No phone")+'</p><p><strong>Route:</strong> '+esc(row.pickup_location||"Pickup not provided")+' → '+esc(row.destination||"Destination not provided")+'</p><p><strong>Ride time:</strong> '+esc(date(row.ride_time))+'</p><time>Requested '+esc(date(row.created_at))+'</time><div class="actions"><a href="ride-requests.html">Open ride requests</a></div></article>';
      }).join(""):empty("You have no pending ride requests.");
      updatedEl.textContent="Updated "+new Date().toLocaleTimeString();
    }catch(error){
      console.error("Could not load BUYZA notifications:",error);
      updatedEl.textContent="Notifications could not be loaded.";
      messagesEl.innerHTML='<div class="state error">Could not load unread messages. '+esc(error.message||"Check your connection and Supabase access.")+'</div>';
      ridesEl.innerHTML=empty("Ride notifications could not be loaded.");
    }finally{loading=false;document.getElementById("refreshButton").disabled=false}
  }
  document.getElementById("refreshButton").addEventListener("click",load);
  load();timer=setInterval(load,30000);window.addEventListener("beforeunload",()=>clearInterval(timer));
})();
</script>
</body>
</html>
