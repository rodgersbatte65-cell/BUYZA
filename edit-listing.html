<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Edit Listing - BUYZA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.back {
    color: white;
    text-decoration: none;
    background: #374151;
    padding: 10px 16px;
    border-radius: 8px;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

.form-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

h1 {
    margin-top: 0;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

.current-image {
    width: 180px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 10px;
    display: block;
}

.save-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #ff6b00;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.save-btn:hover {
    background: #e85f00;
}

.message {
    text-align: center;
    padding: 30px;
}

.error {
    color: #dc2626;
}

</style>

</head>

<body>

<header>

<div class="logo">
BUYZA
</div>

<a href="my-listings.html" class="back">
← My Listings
</a>

</header>


<div class="container">

<div class="form-box">

<h1>
✏️ Edit Listing
</h1>

<div id="message" class="message">
Loading listing...
</div>

<form id="editForm" style="display:none;">

<label>
Product Name
</label>

<input
type="text"
id="name"
required
>


<label>
Price (UGX)
</label>

<input
type="number"
id="price"
required
>


<label>
Category
</label>

<select id="category" required>

<option value="">Select Category</option>

<option value="Phones">Phones</option>

<option value="Cars">Cars</option>

<option value="Fashion">Fashion</option>

<option value="Electronics">Electronics</option>

<option value="Home">Home</option>

<option value="Other">Other</option>

</select>


<label>
Location
</label>

<input
type="text"
id="location"
required
>


<label>
Phone Number
</label>

<input
type="text"
id="phone"
required
>


<label>
Description
</label>

<textarea
id="description"
required
></textarea>


<label>
Current Product Image
</label>

<img
id="currentImage"
class="current-image"
src=""
alt="Current product image"
>


<label>
Change Image (optional)
</label>

<input
type="file"
id="image"
accept="image/*"
>


<button
type="submit"
class="save-btn"
id="saveButton">

💾 Save Changes

</button>

</form>

</div>

</div>


<script>

const SUPABASE_URL =
"https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";

const params =
new URLSearchParams(window.location.search);

const productId =
params.get("id");

const userData =
localStorage.getItem("buyza_user");

const token =
localStorage.getItem("buyza_access_token");

const message =
document.getElementById("message");

const form =
document.getElementById("editForm");


let currentProduct = null;


if (!userData || !token) {

    window.location.href = "login.html";

}


else if (!productId) {

    message.innerHTML =
        "<div class='error'>❌ No product ID was provided.</div>";

}


else {

    loadProduct();

}


async function loadProduct() {

    try {

        const user =
            JSON.parse(userData);


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                encodeURIComponent(productId) +
                "&select=*",
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(error);

            message.innerHTML =
                "<div class='error'>" +
                "❌ Could not load this listing." +
                "</div>";

            return;
        }


        const products =
            await response.json();


        if (!products.length) {

            message.innerHTML =
                "<div class='error'>" +
                "❌ Listing not found." +
                "</div>";

            return;
        }


        currentProduct =
            products[0];


        if (
            currentProduct.user_id &&
            currentProduct.user_id !== user.id
        ) {

            message.innerHTML =
                "<div class='error'>" +
                "❌ You can only edit your own listings." +
                "</div>";

            return;
        }


        document.getElementById("name").value =
            currentProduct.name || "";


        document.getElementById("price").value =
            currentProduct.price || "";


        document.getElementById("category").value =
            currentProduct.category || "";


        document.getElementById("location").value =
            currentProduct.location || "";


        document.getElementById("phone").value =
            currentProduct.phone || "";


        document.getElementById("description").value =
            currentProduct.description || "";


        const image =
            document.getElementById("currentImage");


        if (currentProduct.image_url) {

            image.src =
                currentProduct.image_url;

        }

        else {

            image.style.display =
                "none";
        }


        message.style.display =
            "none";

        form.style.display =
            "block";

    }

    catch (error) {

        console.error(error);

        message.innerHTML =
            "<div class='error'>" +
            "❌ Connection error." +
            "</div>";

    }

}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const saveButton =
            document.getElementById("saveButton");


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        try {

            const updates = {

                name:
                    document.getElementById("name").value.trim(),

                price:
                    Number(
                        document.getElementById("price").value
                    ),

                category:
                    document.getElementById("category").value,

                location:
                    document.getElementById("location").value.trim(),

                phone:
                    document.getElementById("phone").value.trim(),

                description:
                    document.getElementById("description").value.trim()

            };


            const imageFile =
                document.getElementById("image").files[0];


            /*
             * Upload new image if selected
             */

            if (imageFile) {

                const fileName =
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2) +
                    "-" +
                    imageFile.name
                        .replace(/\s+/g, "-");


                const uploadResponse =
                    await fetch(
                        SUPABASE_URL +
                        "/storage/v1/object/product-images/" +
                        fileName,
                        {
                            method: "POST",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " + token,

                                "Content-Type":
                                    imageFile.type
                            },

                            body:
                                imageFile
                        }
                    );


                if (!uploadResponse.ok) {

                    const uploadError =
                        await uploadResponse.text();

                    throw new Error(
                        "Image upload failed: " +
                        uploadError
                    );

                }


                updates.image_url =
                    SUPABASE_URL +
                    "/storage/v1/object/public/product-images/" +
                    fileName;

            }


            /*
             * Update product
             */

            const updateResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/products?id=eq." +
                    encodeURIComponent(productId),
                    {
                        method: "PATCH",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " + token,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=representation"
                        },

                        body:
                            JSON.stringify(updates)
                    }
                );


            if (!updateResponse.ok) {

                const error =
                    await updateResponse.text();

                throw new Error(error);

            }


            alert(
                "✅ Listing updated successfully!"
            );


            window.location.href =
                "my-listings.html";

        }

        catch (error) {

            console.error(error);

            alert(
                "❌ Update failed:\n\n" +
                error.message
            );


            saveButton.disabled =
                false;

            saveButton.textContent =
                "💾 Save Changes";

        }

    }
);

</script>

</body>

</html>
