<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .current-image {
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .current-image img {
            width: 180px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>BUYZA</h1>
</header>

<div class="container">

    <a href="my-listings.html" class="back">← Back to My Listings</a>

    <h2>✏️ Edit Your Listing</h2>

    <form id="editForm">

        <label>Product Name</label>
        <input type="text" id="name" required>

        <label>Price (UGX)</label>
        <input type="number" id="price" required>

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option value="Phones & Tablets">Phones & Tablets</option>
            <option value="Cars">Cars</option>
            <option value="Fashion">Fashion</option>
            <option value="Electronics">Electronics</option>
            <option value="Home">Home</option>
            <option value="Jobs">Jobs</option>
            <option value="Other">Other</option>
        </select>

        <label>Location</label>
        <input type="text" id="location" required>

        <label>Phone Number</label>
        <input type="text" id="phone" required>

        <label>Description</label>
        <textarea id="description" required></textarea>

        <label>Current Image</label>

        <div class="current-image" id="currentImage">
            Loading image...
        </div>

        <label>Replace Image (optional)</label>
        <input type="file" id="image" accept="image/*">

        <button type="submit">💾 Save Changes</button>

        <div id="message"></div>

    </form>

</div>

<script>

const SUPABASE_URL = "https://xbjmdsdgisusnxdmlrxh.supabase.co";
const SUPABASE_KEY = "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";

const userData = localStorage.getItem("buyza_user");
const accessToken = localStorage.getItem("buyza_access_token");

if (!userData || !accessToken) {
    window.location.href = "login.html";
}

const user = JSON.parse(userData);

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

if (!productId) {
    document.getElementById("message").textContent =
        "❌ No listing selected.";
    document.getElementById("editForm").style.display = "none";
}

let currentProduct = null;


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct() {

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}&select=*`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + accessToken
                }
            }
        );

        const products = await response.json();

        if (!products.length) {
            document.getElementById("message").textContent =
                "❌ Listing not found.";
            return;
        }

        const product = products[0];
        currentProduct = product;

        /* Make sure this listing belongs to the logged-in user */

        if (product.user_id !== user.id) {

            document.getElementById("message").textContent =
                "❌ You can only edit your own listings.";

            document.getElementById("editForm").style.display = "none";

            return;
        }

        /* Fill form */

        document.getElementById("name").value =
            product.name || "";

        document.getElementById("price").value =
            product.price || "";

        document.getElementById("category").value =
            product.category || "";

        document.getElementById("location").value =
            product.location || "";

        document.getElementById("phone").value =
            product.phone || "";

        document.getElementById("description").value =
            product.description || "";


        /* Current image */

        if (product.image_url) {

            document.getElementById("currentImage").innerHTML = `
                <img src="${product.image_url}" alt="Current product image">
            `;

        } else {

            document.getElementById("currentImage").textContent =
                "No image uploaded.";

        }

    } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "❌ Could not load listing.";

    }
}


/* =========================
   SAVE CHANGES
========================= */

document.getElementById("editForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const message = document.getElementById("message");

    message.textContent = "Saving changes...";

    try {

        let imageUrl = currentProduct.image_url || "";

        const imageFile = document.getElementById("image").files[0];


        /* =========================
           UPLOAD NEW IMAGE
        ========================= */

        if (imageFile) {

            const fileExtension =
                imageFile.name.split(".").pop();

            const fileName =
                `${Date.now()}-${Math.random()
                .toString(36)
                .substring(2)}.${fileExtension}`;

            const uploadResponse = await fetch(
                `${SUPABASE_URL}/storage/v1/object/product-images/${fileName}`,
                {
                    method: "POST",

                    headers: {
                        "Authorization": "Bearer " + accessToken,
                        "apikey": SUPABASE_KEY,
                        "Content-Type": imageFile.type
                    },

                    body: imageFile
                }
            );

            if (!uploadResponse.ok) {

                const uploadError =
                    await uploadResponse.text();

                console.error(uploadError);

                message.textContent =
                    "❌ Image upload failed.";

                return;
            }

            imageUrl =
                `${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
        }


        /* =========================
           UPDATE PRODUCT
        ========================= */

        const updatedProduct = {

            name: document.getElementById("name").value.trim(),

            price: Number(
                document.getElementById("price").value
            ),

            category:
                document.getElementById("category").value,

            location:
                document.getElementById("location").value.trim(),

            phone:
                document.getElementById("phone").value.trim(),

            description:
                document.getElementById("description").value.trim(),

            image_url: imageUrl
        };


        const updateResponse = await fetch(
            `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}`,
            {
                method: "PATCH",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + accessToken,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify(updatedProduct)
            }
        );


        if (!updateResponse.ok) {

            const updateError =
                await updateResponse.text();

            console.error(updateError);

            message.textContent =
                "❌ Could not update listing.";

            return;
        }


        message.textContent =
            "✅ Listing updated successfully!";

        setTimeout(function() {

            window.location.href =
                "my-listings.html";

        }, 1000);


    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ Something went wrong.";

    }

});


loadProduct();

</script>

</body>
</html>
