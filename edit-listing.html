<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Listing - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .current-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            background: #eee;
            border-radius: 8px;
            margin-top: 8px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
        }

        #loading {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>

    <h1>BUYZA</h1>

    <div>
        <a href="index.html">Home</a>
        <a href="account.html">Account</a>
    </div>

</header>


<div class="container">

    <div class="box">

        <h2>✏️ Edit Listing</h2>

        <div id="loading">
            Loading listing...
        </div>


        <form
            id="editForm"
            style="display:none;"
        >

            <label>Product Name</label>

            <input
                type="text"
                id="name"
                required
            >


            <label>Price (UGX)</label>

            <input
                type="number"
                id="price"
                required
            >


            <label>Category</label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Phones & Tablets">
                    Phones & Tablets
                </option>

                <option value="Cars">
                    Cars
                </option>

                <option value="Fashion">
                    Fashion
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Home & Garden">
                    Home & Garden
                </option>

                <option value="Jobs">
                    Jobs
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Location</label>

            <input
                type="text"
                id="location"
                required
            >


            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                required
            >


            <label>Description</label>

            <textarea
                id="description"
                required
            ></textarea>


            <label>Current Product Image</label>

            <img
                id="currentImage"
                class="current-image"
                alt="Current product image"
            >


            <label>
                Replace Image
                <small>(optional)</small>
            </label>

            <input
                type="file"
                id="image"
                accept="image/*"
            >


            <button
                type="submit"
                id="saveButton"
            >
                💾 Save Changes
            </button>

        </form>


        <div id="message"></div>


        <a
            href="my-listings.html"
            class="back"
        >
            ← Back to My Listings
        </a>

    </div>

</div>


<!-- BUYZA automatic session refresh -->
<script src="auth.js"></script>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


const params =
    new URLSearchParams(
        window.location.search
    );


const productId =
    params.get("id");


let currentProduct = null;

let currentUser = null;


async function startEditPage() {

    const userData =
        localStorage.getItem("buyza_user");


    if (!userData) {

        window.location.href =
            "login.html";

        return;
    }


    /*
     * Refresh the session before
     * loading the listing.
     */
    const sessionOK =
        await checkBuyzaSession();


    const accessToken =
        localStorage.getItem(
            "buyza_access_token"
        );


    if (!sessionOK || !accessToken) {

        window.location.href =
            "login.html";

        return;
    }


    currentUser =
        JSON.parse(userData);


    if (!productId) {

        showError(
            "Product ID is missing."
        );

        return;
    }


    await loadProduct();
}


async function loadProduct() {

    const accessToken =
        localStorage.getItem(
            "buyza_access_token"
        );


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                encodeURIComponent(productId) +
                "&select=*",
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + accessToken
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );
        }


        const products =
            await response.json();


        if (!products.length) {

            showError(
                "Listing not found."
            );

            return;
        }


        currentProduct =
            products[0];


        /*
         * Make sure the listing belongs
         * to the logged-in user.
         */
        if (
            currentProduct.user_id !==
            currentUser.id
        ) {

            showError(
                "You can only edit your own listings."
            );

            return;
        }


        document.getElementById("name").value =
            currentProduct.name || "";


        document.getElementById("price").value =
            currentProduct.price || "";


        document.getElementById("category").value =
            currentProduct.category || "";


        document.getElementById("location").value =
            currentProduct.location || "";


        document.getElementById("phone").value =
            currentProduct.phone || "";


        document.getElementById("description").value =
            currentProduct.description || "";


        document.getElementById("currentImage").src =
            currentProduct.image_url ||
            "https://via.placeholder.com/500x350?text=BUYZA";


        document.getElementById("loading").style.display =
            "none";


        document.getElementById("editForm").style.display =
            "block";


    } catch (error) {

        console.error(error);

        showError(
            "Could not load listing."
        );
    }
}


/*
 * Save edited listing.
 */
document.getElementById("editForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const message =
            document.getElementById(
                "message"
            );


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        /*
         * Refresh the session immediately
         * before saving.
         */
        const sessionOK =
            await checkBuyzaSession();


        if (!sessionOK) {

            message.style.color =
                "#d32f2f";

            message.textContent =
                "❌ Your login session expired. Please login again.";

            return;
        }


        const accessToken =
            localStorage.getItem(
                "buyza_access_token"
            );


        try {

            saveButton.disabled = true;

            saveButton.textContent =
                "Saving...";


            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            const price =
                document.getElementById(
                    "price"
                ).value;


            const category =
                document.getElementById(
                    "category"
                ).value;


            const location =
                document.getElementById(
                    "location"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            const description =
                document.getElementById(
                    "description"
                ).value.trim();


            const imageInput =
                document.getElementById(
                    "image"
                );


            const newImage =
                imageInput.files[0];


            let imageUrl =
                currentProduct.image_url;


            /*
             * If the user selected a new image,
             * upload it first.
             */
            if (newImage) {

                const extension =
                    newImage.name
                        .split(".")
                        .pop();


                const fileName =
                    currentUser.id +
                    "_" +
                    Date.now() +
                    "." +
                    extension;


                const uploadResponse =
                    await fetch(
                        SUPABASE_URL +
                        "/storage/v1/object/product-images/" +
                        fileName,
                        {
                            method: "POST",

                            headers: {
                                "apikey": SUPABASE_KEY,
                                "Authorization":
                                    "Bearer " +
                                    accessToken,
                                "Content-Type":
                                    newImage.type ||
                                    "application/octet-stream"
                            },

                            body: newImage
                        }
                    );


                if (!uploadResponse.ok) {

                    throw new Error(
                        "Image upload failed: " +
                        await uploadResponse.text()
                    );
                }


                imageUrl =
                    SUPABASE_URL +
                    "/storage/v1/object/public/product-images/" +
                    fileName;
            }


            /*
             * Update product.
             */
            const updateResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/products?id=eq." +
                    encodeURIComponent(productId),
                    {
                        method: "PATCH",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                accessToken,
                            "Content-Type":
                                "application/json",
                            "Prefer":
                                "return=representation"
                        },

                        body: JSON.stringify({

                            name: name,

                            price: price,

                            category: category,

                            location: location,

                            phone: phone,

                            description: description,

                            image_url: imageUrl

                        })
                    }
                );


            if (!updateResponse.ok) {

                throw new Error(
                    "Update failed: " +
                    await updateResponse.text()
                );
            }


            message.style.color =
                "green";


            message.textContent =
                "✅ Listing updated successfully!";


            saveButton.textContent =
                "✅ Saved";


            setTimeout(function() {

                window.location.href =
                    "my-listings.html";

            }, 1000);


        } catch (error) {

            console.error(error);


            message.style.color =
                "#d32f2f";


            message.textContent =
                "❌ " + error.message;


            saveButton.disabled =
                false;


            saveButton.textContent =
                "💾 Save Changes";
        }

    }
);


function showError(message) {

    document.getElementById("loading").innerHTML =
        "❌ " + message;
}


startEditPage();

</script>

</body>
</html>
