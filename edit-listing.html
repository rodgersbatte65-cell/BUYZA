<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .top h2 {
            margin: 0;
        }

        .back {
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        .listings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .listing {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .listing img {
            width: 100%;
            height: 210px;
            object-fit: cover;
        }

        .no-image {
            height: 210px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .content {
            padding: 18px;
        }

        .content h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .location {
            color: #666;
            margin-bottom: 10px;
        }

        .description {
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .buttons a,
        .buttons button {
            flex: 1;
            min-width: 120px;
            padding: 11px;
            border: none;
            border-radius: 7px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .edit {
            background: #111;
            color: white;
        }

        .delete {
            background: #d32f2f;
            color: white;
        }

        #message {
            text-align: center;
            margin: 25px 0;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>BUYZA</h1>
</header>

<div class="container">

    <div class="top">
        <h2>📦 My Listings</h2>

        <a href="account.html" class="back">
            ← Back to Account
        </a>
    </div>

    <div id="message">
        Loading your listings...
    </div>

    <div class="listings" id="listings"></div>

</div>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


const userData =
    localStorage.getItem("buyza_user");

const accessToken =
    localStorage.getItem("buyza_access_token");


/* =========================
   CHECK LOGIN
========================= */

if (!userData || !accessToken) {

    window.location.href = "login.html";

}

const user = JSON.parse(userData);


/* =========================
   LOAD MY LISTINGS
========================= */

async function loadListings() {

    const message =
        document.getElementById("message");

    const listings =
        document.getElementById("listings");

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/products?select=*&user_id=eq.${encodeURIComponent(user.id)}&order=created_at.desc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + accessToken
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        const products =
            await response.json();


        if (!products.length) {

            message.textContent =
                "You have not posted any listings yet.";

            return;

        }


        message.textContent = "";


        listings.innerHTML =
            products.map(product => {

                const image = product.image_url
                    ? `<img src="${product.image_url}" alt="Product">`
                    : `<div class="no-image">📦</div>`;


                return `

                    <div class="listing">

                        ${image}

                        <div class="content">

                            <h3>
                                ${escapeHtml(product.name || "Unnamed Product")}
                            </h3>

                            <div class="price">
                                UGX ${Number(product.price || 0).toLocaleString()}
                            </div>

                            <div class="location">
                                📍 ${escapeHtml(product.location || "Location not provided")}
                            </div>

                            <div class="description">
                                ${escapeHtml(product.description || "No description")}
                            </div>

                            <div class="buttons">

                                <a
                                    class="edit"
                                    href="edit-listing.html?id=${encodeURIComponent(product.id)}"
                                >
                                    ✏️ Edit Listing
                                </a>

                                <button
                                    class="delete"
                                    onclick="deleteListing('${product.id}')"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");


    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ Could not load your listings.";

    }

}


/* =========================
   DELETE LISTING
========================= */

async function deleteListing(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this listing?"
        );

    if (!confirmDelete) {
        return;
    }


    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(id)}`,
            {
                method: "DELETE",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + accessToken
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        alert("✅ Listing deleted successfully!");

        loadListings();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Could not delete listing."
        );

    }

}


/* =========================
   SECURITY: ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* START */

loadListings();

</script>

</body>
</html>
