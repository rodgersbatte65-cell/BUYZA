<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Listings - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h2 {
            margin: 0;
        }

        .back {
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .listings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .listing {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .listing-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .no-image {
            width: 100%;
            height: 220px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .content {
            padding: 18px;
        }

        .content h3 {
            margin: 0 0 10px;
            font-size: 21px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .category {
            display: inline-block;
            background: #eee;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .location {
            color: #666;
            margin-bottom: 10px;
        }

        .phone {
            margin-bottom: 10px;
        }

        .description {
            color: #555;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .edit-button,
        .delete-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .edit-button {
            background: #111;
            color: white;
        }

        .edit-button:hover {
            background: #333;
        }

        .delete-button {
            background: #d32f2f;
            color: white;
        }

        .delete-button:hover {
            background: #b71c1c;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
        }

        .sell-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        @media (max-width: 600px) {

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>BUYZA</h1>
</header>


<div class="container">

    <div class="top">

        <h2>📦 My Listings</h2>

        <a href="account.html" class="back">
            ← Back to My Account
        </a>

    </div>


    <div id="message">
        Loading your listings...
    </div>


    <div id="listings" class="listings"></div>

</div>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


/* ==========================
   CHECK LOGIN
========================== */

const savedUser =
    localStorage.getItem("buyza_user");

const accessToken =
    localStorage.getItem("buyza_access_token");


if (!savedUser || !accessToken) {

    window.location.href = "login.html";

}


const user = JSON.parse(savedUser);


/* ==========================
   ESCAPE HTML
========================== */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================
   LOAD MY LISTINGS
========================== */

async function loadListings() {

    const message =
        document.getElementById("message");

    const listings =
        document.getElementById("listings");


    message.textContent =
        "Loading your listings...";


    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/products?select=*&user_id=eq.${encodeURIComponent(user.id)}&order=created_at.desc`,

            {
                method: "GET",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + accessToken

                }

            }

        );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(errorText);

            throw new Error(errorText);

        }


        const products =
            await response.json();


        listings.innerHTML = "";


        /* ==========================
           NO LISTINGS
        ========================== */

        if (!products.length) {

            message.innerHTML = `
                <div class="empty">

                    <h3>You have no listings yet.</h3>

                    <p>
                        Start selling your products on BUYZA.
                    </p>

                    <a
                        href="sell.html"
                        class="sell-button"
                    >
                        ➕ Sell a Product
                    </a>

                </div>
            `;

            return;

        }


        message.textContent =
            `You have ${products.length} listing${products.length === 1 ? "" : "s"}.`;


        /* ==========================
           DISPLAY PRODUCTS
        ========================== */

        products.forEach(function(product) {

            const card =
                document.createElement("div");

            card.className = "listing";


            /* IMAGE */

            let imageHTML = "";

            if (product.image_url) {

                imageHTML = `
                    <img
                        class="listing-image"
                        src="${escapeHtml(product.image_url)}"
                        alt="${escapeHtml(product.name)}"
                    >
                `;

            } else {

                imageHTML = `
                    <div class="no-image">
                        📦
                    </div>
                `;

            }


            /* PRODUCT CARD */

            card.innerHTML = `

                ${imageHTML}

                <div class="content">

                    <h3>
                        ${escapeHtml(product.name)}
                    </h3>

                    <div class="price">
                        UGX ${Number(product.price || 0).toLocaleString()}
                    </div>

                    <div class="category">
                        ${escapeHtml(product.category || "Other")}
                    </div>

                    <div class="location">
                        📍 ${escapeHtml(product.location || "Location not provided")}
                    </div>

                    <div class="phone">
                        📞 ${escapeHtml(product.phone || "No phone number")}
                    </div>

                    <div class="description">
                        ${escapeHtml(product.description || "No description")}
                    </div>

                    <div class="buttons">

                        <a
                            class="edit-button"
                            href="edit-listing.html?id=${encodeURIComponent(product.id)}"
                        >
                            ✏️ Edit Listing
                        </a>

                        <button
                            class="delete-button"
                            onclick="deleteListing('${product.id}')"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>
            `;


            listings.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        message.innerHTML = `
            <div class="empty">

                <h3>❌ Could not load your listings</h3>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>
        `;

    }

}


/* ==========================
   DELETE LISTING
========================== */

async function deleteListing(productId) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this listing?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}`,

            {
                method: "DELETE",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + accessToken,

                    "Prefer":
                        "return=minimal"

                }

            }

        );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(errorText);

            alert(
                "❌ Could not delete the listing."
            );

            return;

        }


        alert(
            "✅ Listing deleted successfully!"
        );


        loadListings();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Something went wrong while deleting."
        );

    }

}


/* ==========================
   START
========================== */

loadListings();

</script>

</body>
</html>
