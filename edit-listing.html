<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Listings - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        /* HEADER */

        header {
            background: #111;
            color: white;
            padding: 18px 25px;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .account-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        /* PAGE */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h2 {
            margin: 0;
            font-size: 28px;
        }

        .back-link {
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        /* LISTINGS */

        .listings {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .listing-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
        }

        .listing-card:hover {
            transform: translateY(-3px);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .no-image {
            height: 220px;
            background: #e9e9e9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .card-content {
            padding: 18px;
        }

        .product-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .category {
            display: inline-block;
            padding: 5px 10px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .location {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .phone {
            color: #555;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .description {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        /* ACTION BUTTONS */

        .actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            height: 42px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .edit-btn {
            background: #111;
            color: white;
            border: 1px solid #111;
        }

        .edit-btn:hover {
            background: #333;
        }

        .delete-btn {
            background: white;
            color: #d32f2f;
            border: 1px solid #d32f2f;
        }

        .delete-btn:hover {
            background: #d32f2f;
            color: white;
        }

        /* MESSAGE */

        #message {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 50px 20px;
            border-radius: 14px;
            text-align: center;
        }

        .sell-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #111;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .page-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .page-header h2 {
                font-size: 24px;
            }

            .actions {
                gap: 8px;
            }

            .edit-btn,
            .delete-btn {
                height: 40px;
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            BUYZA
        </div>

        <a href="account.html" class="account-link">
            👤 My Account
        </a>

    </div>

</header>


<div class="container">

    <div class="page-header">

        <h2>
            📦 My Listings
        </h2>

        <a href="account.html" class="back-link">
            ← Back to Account
        </a>

    </div>


    <div id="message">
        Loading your listings...
    </div>


    <div id="listings" class="listings"></div>

</div>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


const savedUser =
    localStorage.getItem("buyza_user");

const accessToken =
    localStorage.getItem("buyza_access_token");


/* LOGIN CHECK */

if (!savedUser || !accessToken) {

    window.location.href = "login.html";

}


const user = JSON.parse(savedUser);


/* ESCAPE HTML */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* LOAD LISTINGS */

async function loadListings() {

    const message =
        document.getElementById("message");

    const listings =
        document.getElementById("listings");


    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/products?select=*&user_id=eq.${encodeURIComponent(user.id)}&order=created_at.desc`,

            {
                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + accessToken

                }
            }

        );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        const products =
            await response.json();


        listings.innerHTML = "";


        if (!products.length) {

            message.innerHTML = `
                <div class="empty">

                    <h3>No listings yet</h3>

                    <p>
                        You haven't posted anything for sale.
                    </p>

                    <a
                        href="sell.html"
                        class="sell-btn"
                    >
                        + Sell a Product
                    </a>

                </div>
            `;

            return;

        }


        message.textContent =
            `You have ${products.length} listing${products.length === 1 ? "" : "s"}.`;


        products.forEach(function(product) {


            let imageHTML;


            if (product.image_url) {

                imageHTML = `
                    <img
                        class="product-image"
                        src="${escapeHtml(product.image_url)}"
                        alt="${escapeHtml(product.name)}"
                    >
                `;

            } else {

                imageHTML = `
                    <div class="no-image">
                        📦
                    </div>
                `;

            }


            const card =
                document.createElement("div");

            card.className =
                "listing-card";


            card.innerHTML = `

                ${imageHTML}

                <div class="card-content">

                    <div class="product-name">
                        ${escapeHtml(product.name)}
                    </div>

                    <div class="price">
                        UGX ${Number(product.price || 0).toLocaleString()}
                    </div>

                    <div class="category">
                        ${escapeHtml(product.category || "Other")}
                    </div>

                    <div class="location">
                        📍 ${escapeHtml(product.location || "Location not provided")}
                    </div>

                    <div class="phone">
                        📞 ${escapeHtml(product.phone || "No phone number")}
                    </div>

                    <div class="description">
                        ${escapeHtml(product.description || "No description")}
                    </div>


                    <div class="actions">

                        <a
                            href="edit-listing.html?id=${encodeURIComponent(product.id)}"
                            class="edit-btn"
                        >
                            ✏️ Edit
                        </a>

                        <button
                            class="delete-btn"
                            onclick="deleteListing('${product.id}')"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>

            `;


            listings.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        message.innerHTML = `
            <div class="empty">

                ❌ Could not load your listings.

            </div>
        `;

    }

}


/* DELETE */

async function deleteListing(productId) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this listing?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}`,

            {
                method: "DELETE",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + accessToken,

                    "Prefer":
                        "return=minimal"

                }

            }

        );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        alert(
            "✅ Listing deleted successfully."
        );


        loadListings();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Could not delete listing."
        );

    }

}


/* START */

loadListings();

</script>

</body>
</html>
