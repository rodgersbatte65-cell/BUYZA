<script>

    const SUPABASE_URL =
        "https://xbjmdsdgisusnxdmlrxh.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


    document
        .getElementById("sellForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const name =
                document
                .getElementById("productName")
                .value
                .trim();


            const price =
                document
                .getElementById("productPrice")
                .value;


            const category =
                document
                .getElementById("category")
                .value;


            const location =
                document
                .getElementById("location")
                .value
                .trim();


            const phone =
                document
                .getElementById("phone")
                .value
                .trim();


            const description =
                document
                .getElementById("description")
                .value
                .trim();


            const imageFile =
                document
                .getElementById("image")
                .files[0];


            if (
                !name ||
                !price ||
                !category ||
                !location ||
                !phone ||
                !description
            ) {

                showMessage(
                    "Please fill in all required fields.",
                    "error"
                );

                return;

            }


            showMessage(
                "Publishing your listing...",
                "success"
            );


            try {

                let imageUrl = "";


                /* =========================
                   UPLOAD PRODUCT IMAGE
                   ========================= */

                if (imageFile) {

                    const fileExtension =
                        imageFile.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                    const fileName =
                        Date.now() +
                        "-" +
                        Math.random()
                        .toString(36)
                        .substring(2) +
                        "." +
                        fileExtension;


                    const uploadResponse =
                        await fetch(
                            SUPABASE_URL +
                            "/storage/v1/object/product-images/" +
                            fileName,
                            {
                                method: "POST",

                                headers: {

                                    "apikey":
                                        SUPABASE_KEY,

                                    "Authorization":
                                        "Bearer " +
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        imageFile.type

                                },

                                body:
                                    imageFile

                            }
                        );


                    if (!uploadResponse.ok) {

                        const uploadError =
                            await uploadResponse.text();

                        console.error(
                            "Image upload error:",
                            uploadError
                        );

                        showMessage(
                            "The image could not be uploaded. Please try another image.",
                            "error"
                        );

                        return;

                    }


                    imageUrl =
                        SUPABASE_URL +
                        "/storage/v1/object/public/product-images/" +
                        fileName;

                }


                /* =========================
                   SAVE PRODUCT
                   ========================= */

                const product = {

                    name: name,

                    price: Number(price),

                    category: category,

                    location: location,

                    phone: phone,

                    description: description,

                    image_url: imageUrl

                };


                const response =
                    await fetch(
                        SUPABASE_URL +
                        "/rest/v1/products",
                        {
                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    SUPABASE_KEY,

                                "Prefer":
                                    "return=representation"

                            },

                            body:
                                JSON.stringify(product)

                        }
                    );


                if (!response.ok) {

                    const error =
                        await response.text();

                    console.error(
                        "Supabase error:",
                        error
                    );

                    showMessage(
                        "There was a problem publishing your listing. Please try again.",
                        "error"
                    );

                    return;

                }


                showMessage(
                    "Your product has been published successfully!",
                    "success"
                );


                document
                    .getElementById("sellForm")
                    .reset();


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1800);


            } catch (error) {

                console.error(
                    "Connection error:",
                    error
                );

                showMessage(
                    "Could not connect to BUYZA database.",
                    "error"
                );

            }

        });


    function showMessage(message, type) {

        const messageBox =
            document.getElementById("message");

        messageBox.textContent =
            message;

        messageBox.className =
            "message " + type;

        messageBox.style.display =
            "block";

    }

</script>
