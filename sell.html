
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell on BUYZA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #ff6b00;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 25px;
            font-weight: bold;
        }

        .home-btn {
            background: #ff6b00;
            color: white !important;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .sell-button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            background: #ff6b00;
            color: white;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .sell-button:hover {
            background: #e85f00;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .success {
            background: #e8f7e8;
            color: #237a23;
        }

        .error {
            background: #ffe8e8;
            color: #b00000;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px 5%;
            }

            .logo {
                font-size: 25px;
            }

            nav a {
                margin-left: 8px;
                font-size: 13px;
            }

            .form-box {
                padding: 25px 20px;
            }

        }

    </style>

</head>

<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            BUYZA
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="sell.html" class="home-btn">
                Sell
            </a>

        </nav>

    </header>


    <!-- SELL FORM -->

    <div class="container">

        <div class="form-box">

            <h1>
                Sell on BUYZA
            </h1>

            <p class="subtitle">
                Create your listing and reach buyers in Uganda.
            </p>


            <form id="sellForm">


                <!-- PRODUCT NAME -->

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Example: Samsung Galaxy S24"
                    required
                >


                <!-- PRICE -->

                <label for="productPrice">
                    Price (UGX)
                </label>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Example: 850000"
                    min="0"
                    required
                >


                <!-- CATEGORY -->

                <label for="category">
                    Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select a category
                    </option>

                    <option value="Phones & Tablets">
                        📱 Phones & Tablets
                    </option>

                    <option value="Cars">
                        🚗 Cars
                    </option>

                    <option value="Property">
                        🏠 Property
                    </option>

                    <option value="Fashion">
                        👕 Fashion
                    </option>

                    <option value="Electronics">
                        💻 Electronics
                    </option>

                    <option value="Furniture">
                        🪑 Furniture
                    </option>

                    <option value="Jobs">
                        💼 Jobs
                    </option>

                    <option value="Services">
                        🔧 Services
                    </option>

                    <option value="Other">
                        📦 Other
                    </option>

                </select>


                <!-- LOCATION -->

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Example: Kampala, Uganda"
                    required
                >


                <!-- PHONE -->

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Example: 0700000000"
                    required
                >


                <!-- DESCRIPTION -->

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe your product..."
                    required
                ></textarea>


                <!-- IMAGE -->

                <label for="image">
                    Product Image
                </label>

                <input
                    type="file"
                    id="image"
                    accept="image/*"
                >


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="sell-button"
                >
                    Publish Listing
                </button>


                <div
                    id="message"
                    class="message"
                ></div>


            </form>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        <h2>
            BUYZA
        </h2>

        <p>
            Buy. Sell. Connect.
        </p>

        <p>
            © 2026 BUYZA. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        document
            .getElementById("sellForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const name =
                    document
                    .getElementById("productName")
                    .value
                    .trim();


                const price =
                    document
                    .getElementById("productPrice")
                    .value;


                const category =
                    document
                    .getElementById("category")
                    .value;


                const location =
                    document
                    .getElementById("location")
                    .value
                    .trim();


                const phone =
                    document
                    .getElementById("phone")
                    .value
                    .trim();


                const description =
                    document
                    .getElementById("description")
                    .value
                    .trim();


                const imageInput =
                    document
                    .getElementById("image");


                if (
                    !name ||
                    !price ||
                    !category ||
                    !location ||
                    !phone ||
                    !description
                ) {

                    showMessage(
                        "Please fill in all required fields.",
                        "error"
                    );

                    return;

                }


                /*
                    Save the listing in the browser.

                    This connects with the current
                    index.html version we created.
                */

                const product = {

                    name: name,

                    price: Number(price),

                    category: category,

                    location: location,

                    phone: phone,

                    description: description,

                    image: ""

                };


                /*
                    Save image as a local browser image
                    when the seller selects one.
                */

                if (imageInput.files.length > 0) {

                    const reader =
                        new FileReader();

                    reader.onload = function() {

                        product.image =
                            reader.result;

                        saveProduct(product);

                    };

                    reader.readAsDataURL(
                        imageInput.files[0]
                    );

                } else {

                    saveProduct(product);

                }

            });


        function saveProduct(product) {

            localStorage.setItem(
                "buyzaProduct",
                JSON.stringify(product)
            );


            showMessage(
                "Your product has been published successfully!",
                "success"
            );


            document
                .getElementById("sellForm")
                .reset();


            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 1800);

        }


        function showMessage(message, type) {

            const messageBox =
                document.getElementById("message");

            messageBox.textContent =
                message;

            messageBox.className =
                "message " + type;

            messageBox.style.display =
                "block";

        }

    </script>


</body>

</html>
```
