<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell a Product - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input[type="file"] {
            background: white;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginStatus {
            background: #f1f1f1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>

    <h1>BUYZA</h1>

    <div>
        <a href="index.html">Home</a>
        <a href="account.html">Account</a>
    </div>

</header>


<div class="container">

    <div class="box">

        <h2>📦 Sell Your Product</h2>

        <div id="loginStatus">
            Checking your login...
        </div>


        <form id="sellForm">

            <label>Product Name</label>

            <input
                type="text"
                id="name"
                placeholder="e.g. iPhone 15"
                required
            >


            <label>Price (UGX)</label>

            <input
                type="number"
                id="price"
                placeholder="e.g. 1500000"
                required
            >


            <label>Category</label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Phones & Tablets">
                    Phones & Tablets
                </option>

                <option value="Cars">
                    Cars
                </option>

                <option value="Fashion">
                    Fashion
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Home & Garden">
                    Home & Garden
                </option>

                <option value="Jobs">
                    Jobs
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Location</label>

            <input
                type="text"
                id="location"
                placeholder="e.g. Kampala"
                required
            >


            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="e.g. 0771234567"
                required
            >


            <label>Description</label>

            <textarea
                id="description"
                placeholder="Describe your product..."
                required
            ></textarea>


            <label>Product Image</label>

            <input
                type="file"
                id="image"
                accept="image/*"
                required
            >


            <button
                type="submit"
                id="submitButton"
            >
                🚀 Post Product
            </button>

        </form>


        <div id="message"></div>


        <a
            href="index.html"
            class="back"
        >
            ← Back to BUYZA
        </a>

    </div>

</div>


<!-- BUYZA automatic session refresh -->
<script src="auth.js"></script>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


let currentUser = null;


async function startSellPage() {

    const loginStatus =
        document.getElementById("loginStatus");


    /*
     * Refresh the session first.
     */
    const sessionOK =
        await checkBuyzaSession();


    const userData =
        localStorage.getItem("buyza_user");


    const accessToken =
        localStorage.getItem("buyza_access_token");


    if (!sessionOK || !userData || !accessToken) {

        loginStatus.innerHTML =
            "❌ You are not logged in.";


        document.getElementById(
            "sellForm"
        ).style.display = "none";


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1500);


        return;
    }


    currentUser =
        JSON.parse(userData);


    loginStatus.innerHTML =
        "✅ Logged in as: <strong>" +
        escapeHtml(
            currentUser.email || "User"
        ) +
        "</strong>";
}


/*
 * Upload product and save it.
 */
document.getElementById("sellForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const message =
            document.getElementById("message");


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        /*
         * Refresh session immediately
         * before uploading.
         */
        const sessionOK =
            await checkBuyzaSession();


        if (!sessionOK) {

            message.style.color =
                "#d32f2f";

            message.textContent =
                "❌ Your login session expired. Please login again.";

            return;
        }


        const accessToken =
            localStorage.getItem(
                "buyza_access_token"
            );


        const userData =
            localStorage.getItem(
                "buyza_user"
            );


        if (!userData || !accessToken) {

            window.location.href =
                "login.html";

            return;
        }


        currentUser =
            JSON.parse(userData);


        submitButton.disabled = true;

        submitButton.textContent =
            "Uploading...";


        message.style.color =
            "#333";

        message.textContent =
            "Please wait while BUYZA uploads your product...";


        try {

            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            const price =
                document.getElementById(
                    "price"
                ).value;


            const category =
                document.getElementById(
                    "category"
                ).value;


            const location =
                document.getElementById(
                    "location"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            const description =
                document.getElementById(
                    "description"
                ).value.trim();


            const imageInput =
                document.getElementById(
                    "image"
                );


            const imageFile =
                imageInput.files[0];


            if (!imageFile) {

                throw new Error(
                    "Please choose a product image."
                );
            }


            /*
             * Create a unique file name.
             */
            const fileExtension =
                imageFile.name
                    .split(".")
                    .pop();


            const fileName =
                currentUser.id +
                "_" +
                Date.now() +
                "." +
                fileExtension;


            /*
             * Upload image.
             */
            const uploadResponse =
                await fetch(
                    SUPABASE_URL +
                    "/storage/v1/object/product-images/" +
                    fileName,
                    {
                        method: "POST",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                accessToken,
                            "Content-Type":
                                imageFile.type ||
                                "application/octet-stream"
                        },

                        body: imageFile
                    }
                );


            if (!uploadResponse.ok) {

                const error =
                    await uploadResponse.text();


                throw new Error(
                    "Image upload failed: " +
                    error
                );
            }


            /*
             * Public image URL.
             */
            const imageUrl =
                SUPABASE_URL +
                "/storage/v1/object/public/product-images/" +
                fileName;


            /*
             * Save product in database.
             */
            const productResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/products",
                    {
                        method: "POST",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                accessToken,
                            "Content-Type":
                                "application/json",
                            "Prefer":
                                "return=representation"
                        },

                        body: JSON.stringify({

                            name: name,

                            price: price,

                            category: category,

                            location: location,

                            phone: phone,

                            description: description,

                            image_url: imageUrl,

                            user_id: currentUser.id

                        })
                    }
                );


            if (!productResponse.ok) {

                const error =
                    await productResponse.text();


                throw new Error(
                    "Product save failed: " +
                    error
                );
            }


            message.style.color =
                "green";


            message.textContent =
                "✅ Product posted successfully!";


            submitButton.textContent =
                "✅ Posted";


            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 1000);


        } catch (error) {

            console.error(error);


            message.style.color =
                "#d32f2f";


            message.textContent =
                "❌ " + error.message;


            submitButton.disabled =
                false;


            submitButton.textContent =
                "🚀 Post Product";
        }

    }
);


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


startSellPage();

</script>

</body>
</html>
