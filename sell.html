<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell Product - BUYZA Uganda</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #ff7a00;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .login-message {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #ff7a00;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e66d00;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .preview {
            margin-top: 15px;
            text-align: center;
        }

        .preview img {
            max-width: 250px;
            max-height: 250px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>BUYZA</h1>
    <a href="index.html">← Home</a>
</header>

<div class="container">

    <h2>🛍️ Sell Your Product</h2>

    <div id="loginMessage" class="login-message">
        Checking your account...
    </div>

    <form id="sellForm">

        <label>Product Name</label>
        <input
            type="text"
            id="name"
            placeholder="Example: iPhone 15"
            required
        >

        <label>Price (UGX)</label>
        <input
            type="number"
            id="price"
            placeholder="Example: 1500000"
            required
        >

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option value="Electronics">Electronics</option>
            <option value="Phones">Phones</option>
            <option value="Cars">Cars</option>
            <option value="Fashion">Fashion</option>
            <option value="Home">Home</option>
            <option value="Jobs">Jobs</option>
            <option value="Other">Other</option>
        </select>

        <label>Location</label>
        <input
            type="text"
            id="location"
            placeholder="Example: Kampala"
            required
        >

        <label>Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="Example: 0700123456"
            required
        >

        <label>Description</label>
        <textarea
            id="description"
            placeholder="Describe your product..."
            required
        ></textarea>

        <label>Product Image</label>
        <input
            type="file"
            id="image"
            accept="image/*"
            required
        >

        <div class="preview">
            <img id="previewImage">
        </div>

        <button type="submit" id="submitButton">
            🚀 Publish Product
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


const user =
    JSON.parse(
        localStorage.getItem("buyza_user")
    );

const token =
    localStorage.getItem(
        "buyza_access_token"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const form =
    document.getElementById(
        "sellForm"
    );


const message =
    document.getElementById(
        "message"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


/* CHECK LOGIN */

if (!user || !token) {

    loginMessage.innerHTML =
        "⚠️ You must login before selling a product.";

    form.style.display = "none";

}

else {

    loginMessage.innerHTML =
        "✅ Logged in as: " +
        escapeHtml(user.email);

}


/* IMAGE PREVIEW */

document
    .getElementById("image")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) return;

            const preview =
                document.getElementById(
                    "previewImage"
                );

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "inline-block";

        }
    );


/* SELL PRODUCT */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        if (!user || !token) {

            message.innerHTML =
                "❌ Please login first.";

            return;

        }


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const price =
            document.getElementById(
                "price"
            ).value;


        const category =
            document.getElementById(
                "category"
            ).value;


        const location =
            document.getElementById(
                "location"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const imageFile =
            document.getElementById(
                "image"
            ).files[0];


        if (!imageFile) {

            message.innerHTML =
                "❌ Please select an image.";

            return;

        }


        submitButton.disabled = true;

        submitButton.innerHTML =
            "⏳ Publishing...";


        try {

            /* CREATE UNIQUE IMAGE NAME */

            const fileExtension =
                imageFile.name
                    .split(".")
                    .pop();

            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2) +
                "." +
                fileExtension;


            /* UPLOAD IMAGE */

            const uploadResponse =
                await fetch(
                    SUPABASE_URL +
                    "/storage/v1/object/product-images/" +
                    fileName,
                    {

                        method: "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                token,

                            "Content-Type":
                                imageFile.type

                        },

                        body:
                            imageFile

                    }
                );


            if (!uploadResponse.ok) {

                const error =
                    await uploadResponse.text();

                throw new Error(
                    "Image upload failed: " +
                    error
                );

            }


            /* PUBLIC IMAGE URL */

            const imageUrl =
                SUPABASE_URL +
                "/storage/v1/object/public/product-images/" +
                fileName;


            /* SAVE PRODUCT */

            const productResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/products",
                    {

                        method: "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                token,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=representation"

                        },

                        body:
                            JSON.stringify({

                                name:
                                    name,

                                price:
                                    Number(price),

                                category:
                                    category,

                                location:
                                    location,

                                phone:
                                    phone,

                                description:
                                    description,

                                image_url:
                                    imageUrl,

                                user_id:
                                    user.id

                            })

                    }
                );


            if (!productResponse.ok) {

                const error =
                    await productResponse.text();

                throw new Error(
                    "Product save failed: " +
                    error
                );

            }


            message.innerHTML =
                "✅ Product published successfully!";

            message.style.color =
                "green";


            form.reset();

            document.getElementById(
                "previewImage"
            ).style.display = "none";


            setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                1500
            );


        }

        catch (error) {

            console.error(error);

            message.innerHTML =
                "❌ " +
                error.message;

            message.style.color =
                "red";

        }


        submitButton.disabled = false;

        submitButton.innerHTML =
            "🚀 Publish Product";

    }
);


/* SECURITY */

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
