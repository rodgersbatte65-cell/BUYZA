<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Account - BUYZA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .account-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .account-card h2 {
            margin-top: 0;
        }

        .email {
            background: #f5f6f8;
            padding: 14px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            border: none;
            cursor: pointer;
            background: #111;
            color: white;
        }

        .button:hover {
            opacity: 0.9;
        }

        .favorite-button {
            background: #e91e63;
        }

        .logout {
            background: #d32f2f;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            header h1 {
                font-size: 23px;
            }

            .container {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>BUYZA</h1>

    <div>
        <a href="index.html">Home</a>
        <a href="sell.html">Sell</a>
    </div>

</header>


<div class="container">

    <div class="account-card">

        <h2>👤 My Account</h2>

        <div class="email">
            <strong>Email:</strong>
            <span id="userEmail">Loading...</span>
        </div>


        <a href="my-listings.html" class="button">
            📋 My Listings
        </a>


        <a href="favorites.html" class="button favorite-button">
            ❤️ My Favorites
        </a>


        <a href="sell.html" class="button">
            ➕ Sell a Product
        </a>


        <button
            class="button logout"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>

</div>


<script>

const userData = localStorage.getItem("buyza_user");

const accessToken =
    localStorage.getItem("buyza_access_token");


if (!userData || !accessToken) {

    window.location.href = "login.html";

} else {

    const user = JSON.parse(userData);

    document.getElementById("userEmail").textContent =
        user.email || "User";
}


function logout() {

    localStorage.removeItem("buyza_user");

    localStorage.removeItem("buyza_access_token");

    window.location.href = "index.html";
}

</script>

</body>
</html>
