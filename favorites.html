<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Listings | BUYZA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#17202a}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee;box-shadow:0 2px 15px rgba(0,0,0,.05)}
.nav{max-width:1200px;height:70px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-size:28px;font-weight:900;color:#ff6500;text-decoration:none;letter-spacing:-1px}.logo span{color:#111}
.nav-links{display:flex;align-items:center;gap:8px}.nav-links a{padding:10px 13px;border-radius:9px;color:#333;text-decoration:none;font-weight:700}.nav-links a:hover{background:#fff1e8;color:#ff6500}.nav-links .sell{background:#ff6500;color:white}
main{max-width:1200px;margin:38px auto;padding:0 20px 60px}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.heading h1{font-size:clamp(28px,5vw,38px);margin-bottom:7px}.heading p{color:#68717d;line-height:1.5}
.count{color:#777;font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{background:white;border:1px solid #e9ebef;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(20,30,40,.04)}
.image{height:205px;background:#f0f1f3;position:relative}.image img{width:100%;height:100%;object-fit:cover;display:block}.no-image{height:100%;display:grid;place-items:center;font-size:42px;color:#aab0b8}
.status{position:absolute;left:10px;top:10px;background:#20252b;color:white;padding:6px 9px;border-radius:20px;font-size:12px;font-weight:700}.status.sold{background:#b42318}
.body{padding:15px}.body h2{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{color:#f26500;font-weight:900;font-size:19px;margin:9px 0}.meta{color:#707780;font-size:13px;line-height:1.7;min-height:22px}.actions{display:flex;gap:8px;margin-top:14px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:9px;padding:11px 8px;font-weight:700}.view{background:#181b20;color:#fff}.remove{background:#fff0e8;color:#db5700}.remove:hover{background:#ffe1cf}
.state{background:white;border:1px solid #eceef1;border-radius:16px;padding:38px 22px;text-align:center;color:#69717a;line-height:1.6;grid-column:1/-1}.state h2{color:#17202a;margin-bottom:8px}.state a{display:inline-block;margin-top:16px;background:#ff6500;color:white;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:9px}.error{color:#9d2525}.loading{grid-column:1/-1;text-align:center;padding:55px 20px;color:#737b85}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:680px){.nav{height:62px;padding:0 12px}.logo{font-size:24px}.nav-links{gap:2px}.nav-links a{padding:9px 8px;font-size:13px}.nav-links .sell{padding:9px 10px}main{margin-top:25px;padding:0 13px 40px}.heading{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.image{height:160px}.body{padding:11px}.body h2{font-size:14px}.price{font-size:17px}.actions{flex-direction:column}}
@media(max-width:380px){.nav-links a{font-size:12px;padding:8px 6px}.grid{grid-template-columns:1fr}.image{height:210px}}
</style>
</head>
<body>
<header>
  <nav class="nav" aria-label="Main navigation">
    <a class="logo" href="index.html">BUY<span>ZA</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="favorites.html" aria-current="page">❤️ Saved</a>
      <a id="accountLink" href="login.html">Login</a>
      <a class="sell" href="sell.html">+ Sell</a>
    </div>
  </nav>
</header>

<main>
  <div class="heading">
    <div><h1>❤️ Saved Listings</h1><p>Your favorite BUYZA listings, all in one place.</p></div>
    <div id="savedCount" class="count"></div>
  </div>
  <section id="savedListings" class="grid" aria-live="polite">
    <div class="loading">Loading your saved listings…</div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://xbjmdsdgisusnxdmlrxh.supabase.co";
const SUPABASE_KEY = "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";
const list = document.getElementById("savedListings");
const count = document.getElementById("savedCount");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
  })[character]);
}

function showMessage(title, message, actionLabel = "Browse listings", actionHref = "index.html", isError = false) {
  list.innerHTML = `<div class="state${isError ? " error" : ""}"><h2>${escapeHTML(title)}</h2><p>${escapeHTML(message)}</p><a href="${escapeHTML(actionHref)}">${escapeHTML(actionLabel)}</a></div>`;
}

async function readError(response) {
  try {
    const body = await response.json();
    return body.message || body.details || body.hint || body.error || `Request failed (${response.status})`;
  } catch (_) {
    return `Request failed (${response.status})`;
  }
}

function formatPrice(value) {
  if (value === null || value === undefined || value === "") return "Contact seller";
  const amount = Number(value);
  return Number.isFinite(amount) ? `UGX ${amount.toLocaleString("en-UG")}` : "Contact seller";
}

function renderListings(products) {
  if (!products.length) {
    count.textContent = "0 saved";
    showMessage("No saved listings yet", "Tap the heart on a listing you like, and it will appear here.");
    return;
  }

  count.textContent = `${products.length} saved ${products.length === 1 ? "listing" : "listings"}`;
  list.innerHTML = products.map(product => {
    const id = escapeHTML(product.id);
    const name = escapeHTML(product.name || "BUYZA listing");
    const imageURL = product.image_url ? escapeHTML(product.image_url) : "";
    const image = imageURL
      ? `<img src="${imageURL}" alt="${name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;no-image&quot;>📦</div>'">`
      : `<div class="no-image">📦</div>`;
    const sold = product.is_sold === true;
    const condition = product.condition ? `Condition: ${escapeHTML(product.condition)}` : "";
    const location = product.location ? `📍 ${escapeHTML(product.location)}` : "";

    return `<article class="card" data-product-id="${id}">
      <div class="image">${image}${sold ? '<span class="status sold">Sold</span>' : '<span class="status">Saved</span>'}</div>
      <div class="body"><h2 title="${name}">${name}</h2><div class="price">${escapeHTML(formatPrice(product.price))}</div>
      <div class="meta">${condition}${condition && location ? "<br>" : ""}${location}</div>
      <div class="actions"><a class="view" href="product.html?id=${encodeURIComponent(String(product.id))}">View listing</a>
      <button class="remove" type="button" data-remove-id="${id}">Remove</button></div></div>
    </article>`;
  }).join("");

  list.querySelectorAll("[data-remove-id]").forEach(button => {
    button.addEventListener("click", () => removeSavedListing(button.dataset.removeId, button));
  });
}

async function loadSavedListings() {
  const token = localStorage.getItem("buyza_access_token");
  const rawUser = localStorage.getItem("buyza_user");
  let user;

  try { user = rawUser ? JSON.parse(rawUser) : null; } catch (_) { user = null; }
  if (!token || !user || !user.id) {
    showMessage("Log in to see saved listings", "Your saved listings are linked to your BUYZA account.", "Log in", "login.html");
    return;
  }

  document.getElementById("accountLink").textContent = "Account";
  document.getElementById("accountLink").href = "account.html";

  const headers = { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${token}` };
  try {
    const favoritesURL = new URL(`${SUPABASE_URL}/rest/v1/favorites`);
    favoritesURL.searchParams.set("select", "product_id");
    favoritesURL.searchParams.set("user_id", `eq.${user.id}`);
    const favoriteResponse = await fetch(favoritesURL, { headers });
    if (!favoriteResponse.ok) throw new Error(await readError(favoriteResponse));

    const favorites = await favoriteResponse.json();
    const ids = [...new Set(favorites.map(row => row.product_id).filter(id => id !== null && id !== undefined))];
    if (!ids.length) {
      renderListings([]);
      return;
    }

    const productsURL = new URL(`${SUPABASE_URL}/rest/v1/products`);
    productsURL.searchParams.set("select", "id,name,price,image_url,location,condition,is_sold");
    productsURL.searchParams.set("id", `in.(${ids.join(",")})`);
    const productsResponse = await fetch(productsURL, { headers });
    if (!productsResponse.ok) throw new Error(await readError(productsResponse));

    const products = await productsResponse.json();
    const byId = new Map(products.map(product => [String(product.id), product]));
    renderListings(ids.map(id => byId.get(String(id))).filter(Boolean));
  } catch (error) {
    console.error("Saved listings could not be loaded:", error);
    showMessage("Could not load saved listings", error.message || "Please refresh and try again.", "Try again", "favorites.html", true);
  }
}

async function removeSavedListing(productId, button) {
  const token = localStorage.getItem("buyza_access_token");
  let user;
  try { user = JSON.parse(localStorage.getItem("buyza_user") || "null"); } catch (_) { user = null; }
  if (!token || !user || !user.id) {
    showMessage("Please log in again", "Your BUYZA session has ended.", "Log in", "login.html");
    return;
  }

  button.disabled = true;
  button.textContent = "Removing…";
  try {
    const url = new URL(`${SUPABASE_URL}/rest/v1/favorites`);
    url.searchParams.set("user_id", `eq.${user.id}`);
    url.searchParams.set("product_id", `eq.${productId}`);
    const response = await fetch(url, {
      method: "DELETE",
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${token}` }
    });
    if (!response.ok) throw new Error(await readError(response));
    await loadSavedListings();
  } catch (error) {
    console.error("Could not remove saved listing:", error);
    button.disabled = false;
    button.textContent = "Remove";
    alert("Could not remove this listing. " + (error.message || "Please try again."));
  }
}

loadSavedListings();
</script>
</body>
</html>
