<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUYZA - Buy & Sell in Uganda</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#17202a;padding-bottom:88px}
button,input,select{font-family:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:1000;background:white;border-bottom:1px solid #eee;box-shadow:0 2px 15px rgba(0,0,0,.05)}
.nav{max-width:1250px;margin:auto;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:30px;font-weight:900;color:#ff6500;letter-spacing:-1px;animation:buyzaLogoSlideIn .85s cubic-bezier(.2,.8,.2,1) both}
.logo span{color:#111}
@keyframes buyzaLogoSlideIn{from{opacity:0;transform:translateX(-70px) rotateY(-18deg)}to{opacity:1;transform:translateX(0) rotateY(0)}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
.nav-links{display:flex;align-items:center;gap:10px}
.nav-btn{border:0;background:transparent;padding:11px 15px;border-radius:10px;font-weight:700;color:#333}
.nav-btn:hover{background:#fff1e8;color:#ff6500}
.notification-btn{position:relative;min-width:44px;font-size:18px}
.notification-badge{position:absolute;top:1px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#e53935;color:white;font-size:10px;line-height:17px;text-align:center;font-weight:800}
.notification-badge[hidden]{display:none}
.bottom-taskbar-wrap{position:fixed;left:0;right:0;bottom:0;z-index:1800;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #e7e9ec;box-shadow:0 -5px 22px rgba(0,0,0,.08);backdrop-filter:blur(12px)}
.bottom-taskbar{max-width:1120px;margin:auto;display:flex;align-items:stretch;justify-content:space-between;gap:4px;overflow-x:auto;scrollbar-width:none}
.bottom-taskbar::-webkit-scrollbar{display:none}
.taskbar-link,.taskbar-action{position:relative;flex:1 0 82px;min-width:70px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 7px;border:0;border-radius:11px;background:transparent;color:#454b53;text-decoration:none;font-size:11px;font-weight:700;white-space:nowrap}
.taskbar-link:hover,.taskbar-action:hover{background:#fff1e8;color:#e85f00}
.taskbar-icon{font-size:19px;line-height:1}
.sell-btn{background:#ff6500;color:white;padding:12px 20px;border-radius:10px;border:0;font-weight:800}
.sell-btn:hover{background:#e95700}
.hero{position:relative;z-index:20;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18),transparent 25%),linear-gradient(135deg,#ff6500,#ff8a00);color:white;padding:65px 20px 80px}
.hero-inner{max-width:1100px;margin:auto;text-align:center}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:1;font-weight:900;letter-spacing:-2px;margin-bottom:20px}
.hero-title-line{display:inline-block;animation:heroTitleMotion 2.4s ease-in-out infinite;will-change:transform,text-shadow}
.hero-title-line:nth-of-type(2){animation-delay:.3s}
