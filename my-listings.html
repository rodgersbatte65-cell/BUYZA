<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Listings - BUYZA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.back-btn {
    color: white;
    text-decoration: none;
    background: #374151;
    padding: 10px 16px;
    border-radius: 8px;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

h1 {
    margin-bottom: 25px;
}

.listing {
    background: white;
    border-radius: 14px;
    margin-bottom: 20px;
    padding: 18px;
    display: flex;
    gap: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.listing img {
    width: 180px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    background: #eee;
}

.info {
    flex: 1;
}

.info h2 {
    margin: 0 0 8px;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.details {
    color: #666;
    margin-bottom: 10px;
}

.description {
    margin-bottom: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
}

.edit-btn,
.delete-btn {
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.edit-btn {
    background: #111827;
    color: white;
    border: none;
}

.delete-btn {
    background: white;
    color: #dc2626;
    border: 2px solid #dc2626;
}

.edit-btn:hover {
    background: #374151;
}

.delete-btn:hover {
    background: #dc2626;
    color: white;
}

.empty {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 12px;
}

.loading {
    text-align: center;
    padding: 40px;
}

.error-box {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    color: #dc2626;
}

@media (max-width: 700px) {

    .listing {
        flex-direction: column;
    }

    .listing img {
        width: 100%;
        height: 220px;
    }

    .buttons {
        flex-direction: column;
    }

    .edit-btn,
    .delete-btn {
        text-align: center;
        width: 100%;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        BUYZA
    </div>

    <a href="account.html" class="back-btn">
        ← My Account
    </a>

</header>


<div class="container">

    <h1>My Listings</h1>

    <div id="listings" class="loading">
        Loading your listings...
    </div>

</div>


<!-- BUYZA SESSION REFRESH -->
<script src="auth.js"></script>


<script>

const SUPABASE_URL =
"https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


const listingsContainer =
document.getElementById("listings");


function escapeHtml(text) {

    if (text === null || text === undefined) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadListings() {

    try {

        listingsContainer.innerHTML =
            "<div class='loading'>🔄 Checking your login...</div>";


        /*
         * Refresh the Supabase session first.
         */
        const sessionOK =
            await checkBuyzaSession();


        if (!sessionOK) {

            listingsContainer.innerHTML =
                "<div class='error-box'>" +
                "<h2>Login required</h2>" +
                "<p>Your session has expired.</p>" +
                "<br>" +
                "<a href='login.html' class='edit-btn'>" +
                "Login Again" +
                "</a>" +
                "</div>";

            return;
        }


        /*
         * Get the latest user information.
         */
        const userData =
            localStorage.getItem("buyza_user");


        if (!userData) {

            window.location.href =
                "login.html";

            return;
        }


        let user;

        try {

            user =
                JSON.parse(userData);

        } catch (error) {

            localStorage.removeItem(
                "buyza_user"
            );

            localStorage.removeItem(
                "buyza_access_token"
            );

            localStorage.removeItem(
                "buyza_refresh_token"
            );

            window.location.href =
                "login.html";

            return;
        }


        /*
         * Get the newest access token
         * AFTER the refresh.
         */
        const token =
            localStorage.getItem(
                "buyza_access_token"
            );


        if (!token) {

            window.location.href =
                "login.html";

            return;
        }


        listingsContainer.innerHTML =
            "<div class='loading'>🔄 Loading your listings...</div>";


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products?select=*&user_id=eq." +
                encodeURIComponent(user.id) +
                "&order=created_at.desc",
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Supabase error:",
                errorText
            );

            listingsContainer.innerHTML =
                "<div class='error-box'>" +
                "<h2>❌ Could not load listings</h2>" +
                "<p>" +
                escapeHtml(errorText) +
                "</p>" +
                "<br>" +
                "<button " +
                "class='edit-btn' " +
                "onclick='loadListings()'>" +
                "Try Again" +
                "</button>" +
                "</div>";

            return;
        }


        const products =
            await response.json();


        if (!products.length) {

            listingsContainer.innerHTML =
                "<div class='empty'>" +

                "<h2>You have no listings yet.</h2>" +

                "<p>" +
                "Start selling on BUYZA." +
                "</p>" +

                "<br>" +

                "<a href='sell.html' class='edit-btn'>" +
                "Sell a Product" +
                "</a>" +

                "</div>";

            return;
        }


        listingsContainer.innerHTML = "";


        products.forEach(product => {

            const image =
                product.image_url ||
                "https://via.placeholder.com/180x150?text=BUYZA";


            const price =
                Number(product.price || 0)
                .toLocaleString();


            const card =
                document.createElement("div");


            card.className =
                "listing";


            card.innerHTML = `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.name)}"
                    onerror="this.src='https://via.placeholder.com/180x150?text=BUYZA'"
                >

                <div class="info">

                    <h2>
                        ${escapeHtml(product.name)}
                    </h2>

                    <div class="price">
                        UGX ${price}
                    </div>

                    <div class="details">
                        📂 ${escapeHtml(product.category)}
                        &nbsp; • &nbsp;
                        📍 ${escapeHtml(product.location)}
                    </div>

                    <div class="details">
                        📞 ${escapeHtml(product.phone)}
                    </div>

                    <div class="description">
                        ${escapeHtml(product.description)}
                    </div>

                    <div class="buttons">

                        <a
                            class="edit-btn"
                            href="edit-listing.html?id=${encodeURIComponent(product.id)}"
                        >
                            ✏️ Edit
                        </a>

                        <button
                            class="delete-btn"
                            onclick="deleteListing('${encodeURIComponent(product.id)}')"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>
            `;


            listingsContainer.appendChild(card);

        });


    } catch (error) {

        console.error(
            "Load listings error:",
            error
        );


        listingsContainer.innerHTML =
            "<div class='error-box'>" +

            "<h2>❌ Connection Error</h2>" +

            "<p>" +
            "Could not load your listings." +
            "</p>" +

            "<p>" +
            escapeHtml(error.message) +
            "</p>" +

            "<br>" +

            "<button " +
            "class='edit-btn' " +
            "onclick='loadListings()'>" +
            "Try Again" +
            "</button>" +

            "</div>";
    }
}


async function deleteListing(encodedId) {

    const productId =
        decodeURIComponent(encodedId);


    const confirmed =
        confirm(
            "Are you sure you want to delete this listing?"
        );


    if (!confirmed) {
        return;
    }


    /*
     * Refresh session before deleting.
     */
    const sessionOK =
        await checkBuyzaSession();


    if (!sessionOK) {

        alert(
            "Your login session has expired. Please login again."
        );

        window.location.href =
            "login.html";

        return;
    }


    const token =
        localStorage.getItem(
            "buyza_access_token"
        );


    if (!token) {

        alert(
            "Your login session has expired. Please login again."
        );

        window.location.href =
            "login.html";

        return;
    }


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                encodeURIComponent(productId),
                {
                    method: "DELETE",

                    headers: {
                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + token,

                        "Prefer":
                            "return=minimal"
                    }
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            console.error(
                "Delete error:",
                error
            );

            alert(
                "❌ Delete failed.\n\n" +
                error
            );

            return;
        }


        alert(
            "✅ Listing deleted successfully."
        );


        await loadListings();

    } catch (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "❌ Something went wrong while deleting."
        );
    }
}


/*
 * Start loading.
 */
loadListings();

</script>

</body>
</html>
