<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Listings - BUYZA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #ff6b00;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 20px;
            font-weight: bold;
        }

        .home-btn {
            background: #ff6b00;
            color: white !important;
            padding: 10px 16px;
            border-radius: 7px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .account {
            color: #666;
            margin-bottom: 30px;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            margin-top: 0;
        }

        .price {
            color: #ff6b00;
            font-size: 20px;
            font-weight: bold;
        }

        .location {
            color: #666;
        }

        .delete-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: #d93025;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        .delete-btn:hover {
            background: #b82018;
        }

        .message {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: #666;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        BUYZA
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="sell.html">
            Sell
        </a>

    </nav>

</header>


<div class="container">

    <h1>
        📦 My Listings
    </h1>

    <p
        id="account"
        class="account"
    >
        Checking account...
    </p>


    <div
        id="products"
        class="products"
    >

        <div class="message">
            Loading your listings...
        </div>

    </div>

</div>


<footer>

    <h2>
        BUYZA
    </h2>

    <p>
        Buy. Sell. Connect.
    </p>

    <p>
        © 2026 BUYZA. All rights reserved.
    </p>

</footer>


<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


const user =
    JSON.parse(
        localStorage.getItem("buyza_user")
    );


const token =
    localStorage.getItem(
        "buyza_access_token"
    );


const productsBox =
    document.getElementById(
        "products"
    );


const account =
    document.getElementById(
        "account"
    );


/* CHECK LOGIN */

if (!user || !token) {

    account.innerHTML =
        "⚠️ Please login to see your listings.";

    productsBox.innerHTML = `
        <div class="message">

            <h3>
                You are not logged in
            </h3>

            <p>
                Please login to view your products.
            </p>

        </div>
    `;

}

else {

    account.innerHTML =
        "Logged in as: " +
        escapeHtml(user.email);

    loadMyListings();

}


/* LOAD USER PRODUCTS */

async function loadMyListings() {

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products" +
                "?select=*" +
                "&user_id=eq." +
                encodeURIComponent(user.id) +
                "&order=created_at.desc",
                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        const products =
            await response.json();


        if (
            !products ||
            products.length === 0
        ) {

            productsBox.innerHTML = `
                <div class="message">

                    <h3>
                        You have no listings yet.
                    </h3>

                    <p>
                        Sell your first product on BUYZA.
                    </p>

                </div>
            `;

            return;

        }


        productsBox.innerHTML =
            products.map(
                function(product) {

                    const image =
                        product.image_url
                        ?
                        `
                        <img
                            src="${escapeHtml(product.image_url)}"
                            alt="${escapeHtml(product.name)}"
                        >
                        `
                        :
                        "";


                    return `

                        <div class="product">

                            ${image}

                            <div class="product-info">

                                <h3>
                                    ${escapeHtml(product.name)}
                                </h3>

                                <p class="price">
                                    UGX
                                    ${Number(
                                        product.price
                                    ).toLocaleString()}
                                </p>

                                <p class="location">
                                    📍
                                    ${escapeHtml(
                                        product.location
                                    )}
                                </p>

                                <p>
                                    ${escapeHtml(
                                        product.description
                                    )}
                                </p>

                                <button
                                    class="delete-btn"
                                    onclick="deleteProduct('${product.id}')"
                                >
                                    🗑️ Delete Listing
                                </button>

                            </div>

                        </div>

                    `;

                }
            ).join("");


    }

    catch (error) {

        console.error(error);

        productsBox.innerHTML = `
            <div class="message">

                <h3>
                    Unable to load your listings
                </h3>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>
        `;

    }

}


/* DELETE PRODUCT */

async function deleteProduct(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this listing?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                encodeURIComponent(id),
                {

                    method: "DELETE",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            throw new Error(error);

        }


        alert(
            "Listing deleted successfully."
        );


        loadMyListings();

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not delete the listing."
        );

    }

}


/* SECURITY */

function escapeHtml(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
