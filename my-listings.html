<script src="auth.js"></script>

<script>

const SUPABASE_URL =
"https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";

const listingsContainer =
document.getElementById("listings");


function escapeHtml(text) {

    if (text === null || text === undefined) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadListings() {

    try {

        listingsContainer.innerHTML =
            "<div class='loading'>" +
            "🔄 Checking login..." +
            "</div>";


        console.log("STEP 1: Checking session");


        const sessionOK =
            await checkBuyzaSession();


        console.log(
            "STEP 2: Session result:",
            sessionOK
        );


        if (!sessionOK) {

            listingsContainer.innerHTML =
                "<div class='empty'>" +
                "<h2>Login required</h2>" +
                "<p>Please login again.</p>" +
                "<a href='login.html' class='edit-btn'>" +
                "Login" +
                "</a>" +
                "</div>";

            return;
        }


        const userData =
            localStorage.getItem("buyza_user");


        if (!userData) {

            window.location.href =
                "login.html";

            return;
        }


        const user =
            JSON.parse(userData);


        const token =
            localStorage.getItem(
                "buyza_access_token"
            );


        console.log(
            "STEP 3: User ID:",
            user.id
        );


        console.log(
            "STEP 4: Access token exists:",
            !!token
        );


        listingsContainer.innerHTML =
            "<div class='loading'>" +
            "🔄 Connecting to BUYZA..." +
            "</div>";


        const url =
            SUPABASE_URL +
            "/rest/v1/products?select=*&user_id=eq." +
            encodeURIComponent(user.id) +
            "&order=created_at.desc";


        console.log(
            "STEP 5: Requesting listings"
        );


        /*
         * Stop waiting after 10 seconds.
         */
        const controller =
            new AbortController();


        const timeout =
            setTimeout(() => {

                controller.abort();

            }, 10000);


        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + token
                    },

                    signal: controller.signal
                }
            );


        clearTimeout(timeout);


        console.log(
            "STEP 6: Supabase response:",
            response.status
        );


        if (!response.ok) {

            const errorText =
                await response.text();


            console.error(
                "SUPABASE ERROR:",
                errorText
            );


            listingsContainer.innerHTML =
                "<div class='empty'>" +

                "<h2>❌ Supabase Error</h2>" +

                "<p>" +
                escapeHtml(errorText) +
                "</p>" +

                "<br>" +

                "<button " +
                "class='edit-btn' " +
                "onclick='loadListings()'>" +
                "Try Again" +
                "</button>" +

                "</div>";


            return;
        }


        const products =
            await response.json();


        console.log(
            "STEP 7: Products:",
            products
        );


        if (!products.length) {

            listingsContainer.innerHTML =
                "<div class='empty'>" +

                "<h2>You have no listings yet.</h2>" +

                "<p>Start selling on BUYZA.</p>" +

                "<br>" +

                "<a href='sell.html' class='edit-btn'>" +
                "Sell a Product" +
                "</a>" +

                "</div>";

            return;
        }


        listingsContainer.innerHTML = "";


        products.forEach(product => {

            const image =
                product.image_url ||
                "https://via.placeholder.com/180x150?text=BUYZA";


            const price =
                Number(product.price || 0)
                .toLocaleString();


            const card =
                document.createElement("div");


            card.className =
                "listing";


            card.innerHTML = `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.name)}"
                    onerror="this.src='https://via.placeholder.com/180x150?text=BUYZA'"
                >

                <div class="info">

                    <h2>
                        ${escapeHtml(product.name)}
                    </h2>

                    <div class="price">
                        UGX ${price}
                    </div>

                    <div class="details">
                        📂 ${escapeHtml(product.category)}
                        &nbsp; • &nbsp;
                        📍 ${escapeHtml(product.location)}
                    </div>

                    <div class="details">
                        📞 ${escapeHtml(product.phone)}
                    </div>

                    <div class="description">
                        ${escapeHtml(product.description)}
                    </div>

                    <div class="buttons">

                        <a
                            class="edit-btn"
                            href="edit-listing.html?id=${encodeURIComponent(product.id)}"
                        >
                            ✏️ Edit
                        </a>

                        <button
                            class="delete-btn"
                            onclick="deleteListing('${encodeURIComponent(product.id)}')"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>
            `;


            listingsContainer.appendChild(card);

        });


    } catch (error) {

        console.error(
            "LOAD LISTINGS ERROR:",
            error
        );


        if (error.name === "AbortError") {

            listingsContainer.innerHTML =
                "<div class='empty'>" +

                "<h2>⏱️ Supabase connection timed out</h2>" +

                "<p>" +
                "The database did not respond within 10 seconds." +
                "</p>" +

                "<br>" +

                "<button " +
                "class='edit-btn' " +
                "onclick='loadListings()'>" +
                "Try Again" +
                "</button>" +

                "</div>";

        } else {

            listingsContainer.innerHTML =
                "<div class='empty'>" +

                "<h2>❌ Error</h2>" +

                "<p>" +
                escapeHtml(error.message) +
                "</p>" +

                "<br>" +

                "<button " +
                "class='edit-btn' " +
                "onclick='loadListings()'>" +
                "Try Again" +
                "</button>" +

                "</div>";
        }
    }
}


async function deleteListing(encodedId) {

    const productId =
        decodeURIComponent(encodedId);


    if (!confirm(
        "Are you sure you want to delete this listing?"
    )) {
        return;
    }


    const sessionOK =
        await checkBuyzaSession();


    if (!sessionOK) {

        alert(
            "Your session has expired. Please login again."
        );

        window.location.href =
            "login.html";

        return;
    }


    const token =
        localStorage.getItem(
            "buyza_access_token"
        );


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                encodeURIComponent(productId),
                {
                    method: "DELETE",

                    headers: {
                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + token,

                        "Prefer":
                            "return=minimal"
                    }
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "❌ Delete failed:\n\n" +
                error
            );

            return;
        }


        alert(
            "✅ Listing deleted successfully."
        );


        loadListings();


    } catch (error) {

        alert(
            "❌ Delete error:\n\n" +
            error.message
        );
    }
}


loadListings();

</script>
