<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Listings - BUYZA</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    display: flex;
    justify-content: space-between;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.back {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
}

.card img {
    width: 180px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
}

.price {
    font-size: 20px;
    font-weight: bold;
}

button,
.edit {
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.edit {
    background: #111827;
    color: white;
    text-decoration: none;
}

.delete {
    background: white;
    color: red;
    border: 1px solid red;
}

#status {
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}
</style>

</head>

<body>

<header>

<div class="logo">BUYZA</div>

<a class="back" href="account.html">
← Account
</a>

</header>


<div class="container">

<h1>My Listings</h1>

<div id="status">
Loading your listings...
</div>

<div id="listings"></div>

</div>


<script>

const SUPABASE_URL =
"https://xbjmdsdgisusnxdmlrxh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


async function loadListings() {

    const status =
        document.getElementById("status");

    const listings =
        document.getElementById("listings");


    try {

        status.innerHTML =
            "Checking your login...";


        const userData =
            localStorage.getItem("buyza_user");


        const token =
            localStorage.getItem(
                "buyza_access_token"
            );


        if (!userData) {

            status.innerHTML =
                "❌ You are not logged in.<br><br>" +
                "<a href='login.html'>Login</a>";

            return;
        }


        if (!token) {

            status.innerHTML =
                "❌ Your login session has expired.<br><br>" +
                "<a href='login.html'>Login again</a>";

            return;
        }


        const user =
            JSON.parse(userData);


        if (!user.id) {

            status.innerHTML =
                "❌ User account information is missing.";

            return;
        }


        status.innerHTML =
            "Loading your listings...";


        const url =
            SUPABASE_URL +
            "/rest/v1/products" +
            "?select=*" +
            "&user_id=eq." +
            encodeURIComponent(user.id) +
            "&order=created_at.desc";


        const response =
            await fetch(url, {

                method: "GET",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " + token,

                    "Content-Type":
                    "application/json"

                }

            });


        const text =
            await response.text();


        console.log(
            "SUPABASE RESPONSE:",
            text
        );


        if (!response.ok) {

            status.innerHTML =
                "❌ Supabase Error<br><br>" +
                text;

            return;
        }


        const products =
            JSON.parse(text);


        status.innerHTML = "";


        if (products.length === 0) {

            status.innerHTML =
                "You have no listings yet.<br><br>" +
                "<a href='sell.html'>Sell a Product</a>";

            return;
        }


        listings.innerHTML = "";


        products.forEach(product => {

            const card =
                document.createElement("div");


            card.className =
                "card";


            const image =
                product.image_url ||
                "https://via.placeholder.com/180";


            card.innerHTML = `

                <img
                    src="${image}"
                    alt="Product"
                >

                <h2>
                    ${product.name || ""}
                </h2>

                <div class="price">
                    UGX ${
                        Number(product.price || 0)
                        .toLocaleString()
                    }
                </div>

                <p>
                    📂 ${product.category || ""}
                </p>

                <p>
                    📍 ${product.location || ""}
                </p>

                <p>
                    📞 ${product.phone || ""}
                </p>

                <p>
                    ${product.description || ""}
                </p>

                <br>

                <a
                    class="edit"
                    href="edit-listing.html?id=${product.id}"
                >
                    ✏️ Edit
                </a>

                <button
                    class="delete"
                    onclick="deleteListing(${product.id})"
                >
                    🗑️ Delete
                </button>

            `;


            listings.appendChild(card);

        });


    } catch (error) {

        console.error(error);


        status.innerHTML =
            "❌ Error<br><br>" +
            error.message;

    }

}


async function deleteListing(id) {

    if (
        !confirm(
            "Are you sure you want to delete this listing?"
        )
    ) {
        return;
    }


    const token =
        localStorage.getItem(
            "buyza_access_token"
        );


    try {

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                id,

                {

                    method: "DELETE",

                    headers: {

                        "apikey":
                        SUPABASE_KEY,

                        "Authorization":
                        "Bearer " + token,

                        "Prefer":
                        "return=minimal"

                    }

                }

            );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "Delete failed:\n" +
                error
            );

            return;
        }


        alert(
            "✅ Listing deleted."
        );


        loadListings();

    } catch (error) {

        alert(
            "Delete error: " +
            error.message
        );

    }

}


loadListings();

</script>

</body>
</html>
