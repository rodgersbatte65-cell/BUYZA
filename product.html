<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BUYZA - Product Details</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f6f8;
        color: #222;
    }

    header {
        background: white;
        padding: 18px 7%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .logo {
        font-size: 30px;
        font-weight: bold;
        color: #ff6b00;
    }

    nav a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
        margin-left: 15px;
    }

    .home-btn {
        background: #ff6b00;
        color: white !important;
        padding: 10px 18px;
        border-radius: 8px;
    }

    .container {
        max-width: 1000px;
        margin: 50px auto;
        padding: 0 20px;
    }

    .product-box {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .product-image {
        width: 100%;
        height: 500px;
        object-fit: cover;
        background: #eee;
    }

    .no-image {
        height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eee;
        color: #777;
        font-size: 22px;
    }

    .details {
        padding: 40px;
    }

    .details h1 {
        font-size: 32px;
        margin-bottom: 20px;
    }

    .price {
        color: #ff6b00;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .info {
        color: #666;
        margin: 12px 0;
        font-size: 16px;
    }

    .description {
        margin-top: 25px;
        line-height: 1.7;
        color: #444;
    }

    .buttons {
        margin-top: 30px;
    }

    .button {
        display: block;
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        border: none;
        border-radius: 8px;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .call-btn {
        background: #ff6b00;
        color: white;
    }

    .whatsapp-btn {
        background: #25d366;
        color: white;
    }

    .back-btn {
        background: #222;
        color: white;
    }

    .loading,
    .error {
        background: white;
        padding: 40px;
        border-radius: 12px;
        text-align: center;
    }

    .error {
        color: #b00000;
    }

    footer {
        background: #222;
        color: white;
        text-align: center;
        padding: 35px;
        margin-top: 70px;
    }

    footer h2 {
        color: #ff6b00;
        margin-bottom: 10px;
    }

    @media (max-width: 700px) {

        header {
            padding: 15px 20px;
        }

        .logo {
            font-size: 25px;
        }

        nav a {
            font-size: 13px;
        }

        .product-box {
            grid-template-columns: 1fr;
        }

        .product-image,
        .no-image {
            height: 350px;
        }

        .details {
            padding: 25px;
        }

        .details h1 {
            font-size: 26px;
        }

    }

</style>
```

</head>

<header>

<footer>

```

</h2>

<p>
    Uganda's Marketplace
</p>

<p style="margin-top:10px;">
    Buy. Sell. Connect.
</p>

<p style="margin-top:15px;">

</footer>

<script>

const SUPABASE_URL =
    "https://xbjmdsdgisusnxdmlrxh.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_FiaziwSklP22XFb1vfazZw_AudR-1-J";


function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function normalizeWhatsApp(phone) {

    let number =
        String(phone || "")
        .replace(/\s/g, "")
        .replace(/-/g, "")
        .replace(/\+/g, "");

    if (number.startsWith("0")) {

        number =
            "256" +
            number.substring(1);

    }

    return number;

}


async function loadProduct() {

    const container =
        document.getElementById(
            "productContainer"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const productId =
        params.get("id");


    if (!productId) {

        container.innerHTML = `
            <div class="error">
                <h2>Product not found</h2>
                <p style="margin-top:10px;">
                    No product ID was provided.
                </p>
            </div>
        `;

        return;

    }


    try {

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                encodeURIComponent(productId) +
                "&select=*",

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (!response.ok) {

            throw new Error(
                "Could not load product"
            );

        }


        const products =
            await response.json();


        if (
            !products ||
            products.length === 0
        ) {

            container.innerHTML = `
                <div class="error">

                    <h2>
                        Product not found
                    </h2>

                    <p style="margin-top:10px;">
                        This product may have been removed.
                    </p>

                </div>
            `;

            return;

        }


        const product =
            products[0];


        let imageHtml = "";


        if (product.image_url) {

            imageHtml = `
                <img
                    class="product-image"
                    src="${escapeHtml(product.image_url)}"
                    alt="${escapeHtml(product.name)}"
                >
            `;

        } else {

            imageHtml = `
                <div class="no-image">
                    📦 No image available
                </div>
            `;

        }


        const phone =
            product.phone || "";


        const whatsappNumber =
            normalizeWhatsApp(phone);


        const whatsappMessage =
            "Hello, I found your product on BUYZA. Is it still available?";


        container.innerHTML = `

            <div class="product-box">

                ${imageHtml}

                <div class="details">

                    <h1>
                        ${escapeHtml(product.name)}
                    </h1>

                    <div class="price">
                        UGX ${Number(product.price || 0).toLocaleString()}
                    </div>

                    <div class="info">
                        📍 ${escapeHtml(product.location)}
                    </div>

                    <div class="info">
                        📂 ${escapeHtml(product.category)}
                    </div>

                    <div class="description">

                        <strong>
                            Description
                        </strong>

                        <p style="margin-top:10px;">
                            ${escapeHtml(product.description)}
                        </p>

                    </div>

                    <div class="buttons">

                        <a
                            class="button call-btn"
                            href="tel:${escapeHtml(phone)}"
                        >
                            📞 Call Seller
                        </a>

                        <a
                            class="button whatsapp-btn"
                            href="https://wa.me/${whatsappNumber}?text=${encodeURIComponent(whatsappMessage)}"
                            target="_blank"
                        >
                            💬 WhatsApp Seller
                        </a>

                        <a
                            class="button back-btn"
                            href="index.html"
                        >
                            ← Back to Listings
                        </a>

                    </div>

                </div>

            </div>

        `;


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                <h2>
                    Could not load product
                </h2>

                <p style="margin-top:10px;">
                    Please check your internet connection
                    and try again.
                </p>

            </div>

        `;

    }

}


loadProduct();

</script>

</body>

</html>
