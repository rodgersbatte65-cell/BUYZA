<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product - BUYZA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
}

header a{
    color:white;
    text-decoration:none;
    margin-left:15px;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.product-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product-image{
    width:100%;
    max-height:550px;
    object-fit:contain;
    background:#eee;
    display:block;
}

.content{
    padding:25px;
}

.category{
    color:#ff6500;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

h2{
    margin:0 0 10px;
    font-size:30px;
}

.price{
    color:#ff6500;
    font-size:26px;
    font-weight:bold;
    margin:15px 0;
}

.location{
    color:#666;
    margin-bottom:15px;
}

.description{
    line-height:1.6;
    margin:20px 0;
}

.buttons{
    display:grid;
    gap:10px;
    margin-top:25px;
}

button,
.button{
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
}

.call{
    background:#111;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.favorite{
    background:#f1f1f1;
    color:#222;
}

.favorite.saved{
    background:#e91e63;
    color:white;
}

.back{
    background:#ddd;
    color:#222;
}

#message{
    text-align:center;
    padding:40px;
}

@media(max-width:600px){

    header{
        padding:15px;
    }

    header h1{
        font-size:23px;
    }

    .container{
        padding:12px;
    }

    h2{
        font-size:24px;
    }

}

</style>

</head>

<body>

<header>

    <h1>BUYZA</h1>

    <div>

        <a href="index.html">
            Home
        </a>

        <a href="account.html">
            Account
        </a>

    </div>

</header>


<div class="container">

    <div id="message">
        Loading product...
    </div>


    <div
        id="product"
        class="product-card"
        style="display:none;"
    >

        <img
            id="productImage"
            class="product-image"
            alt="Product"
        >


        <div class="content">

            <div
                id="category"
                class="category"
            ></div>


            <h2 id="name"></h2>


            <div
                id="price"
                class="price"
            ></div>


            <div
                id="location"
                class="location"
            ></div>


            <div
                id="description"
                class="description"
            ></div>


            <div class="buttons">

                <a
                    id="callButton"
                    class="button call"
                >
                    📞 Call Seller
                </a>


                <a
                    id="whatsappButton"
                    class="button whatsapp"
                    target="_blank"
                >
                    💬 WhatsApp Seller
                </a>


                <button
                    id="favoriteButton"
                    class="favorite"
                    onclick="toggleFavorite()"
                >
                    ♡ Add to Favorites
                </button>


                <a
                    href="index.html"
                    class="button back"
                >
                    ← Back to Listings
                </a>

            </div>

        </div>

    </div>

</div>


<!-- BUYZA SESSION -->

<script src="auth.js"></script>


<script>

/*
====================================================
GET PRODUCT ID
====================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );


const productId =
    params.get("id");


let currentProduct = null;

let favoriteId = null;


/*
====================================================
LOAD PRODUCT
====================================================
*/

async function loadProduct(){

    if(!productId){

        showError(
            "Product ID is missing."
        );

        return;
    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products?id=eq." +
                encodeURIComponent(productId) +
                "&select=*",
                {
                    method:"GET",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const products =
            await response.json();


        if(!products.length){

            showError(
                "Product not found."
            );

            return;
        }


        currentProduct =
            products[0];


        /*
        IMAGE
        */

        const image =
            document.getElementById(
                "productImage"
            );


        image.src =
            currentProduct.image_url ||
            "https://via.placeholder.com/800x500?text=BUYZA";


        /*
        CATEGORY
        */

        document.getElementById(
            "category"
        ).textContent =
            currentProduct.category ||
            "";


        /*
        NAME
        */

        document.getElementById(
            "name"
        ).textContent =
            currentProduct.name ||
            "Product";


        /*
        PRICE
        */

        document.getElementById(
            "price"
        ).textContent =
            "UGX " +
            Number(
                currentProduct.price || 0
            ).toLocaleString();


        /*
        LOCATION
        */

        document.getElementById(
            "location"
        ).textContent =
            "📍 " +
            (
                currentProduct.location ||
                "Uganda"
            );


        /*
        DESCRIPTION
        */

        document.getElementById(
            "description"
        ).textContent =
            currentProduct.description ||
            "No description provided.";


        /*
        PHONE
        */

        const phone =
            currentProduct.phone || "";


        document.getElementById(
            "callButton"
        ).href =
            "tel:" + phone;


        /*
        WHATSAPP
        */

        let whatsappNumber =
            phone.replace(/\D/g,"");


        if(
            whatsappNumber.startsWith("0")
        ){

            whatsappNumber =
                "256" +
                whatsappNumber.substring(1);

        }


        if(
            whatsappNumber &&
            !whatsappNumber.startsWith("256")
        ){

            whatsappNumber =
                "256" +
                whatsappNumber;

        }


        document.getElementById(
            "whatsappButton"
        ).href =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(
                "Hello, I saw your product on BUYZA."
            );


        /*
        SHOW PRODUCT
        */

        document.getElementById(
            "message"
        ).style.display =
            "none";


        document.getElementById(
            "product"
        ).style.display =
            "block";


        /*
        CHECK FAVORITE
        */

        await checkFavorite();


    }catch(error){

        console.error(
            "Product loading error:",
            error
        );


        showError(
            "Could not load product."
        );

    }

}


/*
====================================================
CHECK FAVORITE
====================================================
*/

async function checkFavorite(){

    const userData =
        localStorage.getItem(
            "buyza_user"
        );


    const refreshToken =
        localStorage.getItem(
            "buyza_refresh_token"
        );


    if(
        !userData ||
        !refreshToken
    ){

        return;

    }


    const sessionOK =
        await checkBuyzaSession();


    if(!sessionOK){

        return;

    }


    try{

        const user =
            JSON.parse(userData);


        const accessToken =
            localStorage.getItem(
                "buyza_access_token"
            );


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/favorites" +
                "?user_id=eq." +
                encodeURIComponent(user.id) +
                "&product_id=eq." +
                encodeURIComponent(productId) +
                "&select=id",
                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken
                    }
                }
            );


        if(!response.ok){

            console.error(
                await response.text()
            );

            return;

        }


        const favorites =
            await response.json();


        const button =
            document.getElementById(
                "favoriteButton"
            );


        if(favorites.length > 0){

            favoriteId =
                favorites[0].id;


            button.textContent =
                "♥ Saved to Favorites";


            button.classList.add(
                "saved"
            );

        }else{

            favoriteId = null;


            button.textContent =
                "♡ Add to Favorites";


            button.classList.remove(
                "saved"
            );

        }

    }catch(error){

        console.error(
            "Favorite check error:",
            error
        );

    }

}


/*
====================================================
TOGGLE FAVORITE
====================================================
*/

async function toggleFavorite(){

    const userData =
        localStorage.getItem(
            "buyza_user"
        );


    const refreshToken =
        localStorage.getItem(
            "buyza_refresh_token"
        );


    if(
        !userData ||
        !refreshToken
    ){

        alert(
            "Please login to use Favorites."
        );


        window.location.href =
            "login.html";


        return;

    }


    const sessionOK =
        await checkBuyzaSession();


    if(!sessionOK){

        alert(
            "Your login session has expired. Please login again."
        );


        window.location.href =
            "login.html";


        return;

    }


    try{

        const user =
            JSON.parse(userData);


        const accessToken =
            localStorage.getItem(
                "buyza_access_token"
            );


        const button =
            document.getElementById(
                "favoriteButton"
            );


        /*
        REMOVE
        */

        if(favoriteId){

            const response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/favorites?id=eq." +
                    encodeURIComponent(
                        favoriteId
                    ),
                    {
                        method:"DELETE",

                        headers:{
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                accessToken
                        }
                    }
                );


            if(!response.ok){

                throw new Error(
                    await response.text()
                );

            }


            favoriteId = null;


            button.textContent =
                "♡ Add to Favorites";


            button.classList.remove(
                "saved"
            );


            return;

        }


        /*
        ADD
        */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/favorites",
                {
                    method:"POST",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"
                    },

                    body:JSON.stringify({

                        user_id:
                            user.id,

                        product_id:
                            productId

                    })
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const data =
            await response.json();


        if(data.length){

            favoriteId =
                data[0].id;

        }


        button.textContent =
            "♥ Saved to Favorites";


        button.classList.add(
            "saved"
        );


    }catch(error){

        console.error(error);


        alert(
            "Could not update favorite.\n\n" +
            error.message
        );

    }

}


/*
====================================================
ERROR
====================================================
*/

function showError(message){

    document.getElementById(
        "message"
    ).innerHTML =
        "❌ " + message;

}


/*
====================================================
START
====================================================
*/

loadProduct();

</script>

</body>
</html>
